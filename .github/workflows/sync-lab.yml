name: Sync Lab Published from Catalog

# Phase 4 — automatic catalog synchronization for the AppMintly Lab
# "Published / Released" section.
#
# The roadmap dataset (data/upcoming-apps.json) is the single source of
# truth for the Lab page (static export — no backend). This workflow
# derives the published records from the authoritative production catalog
# (data/apps.json) and commits them idempotently:
#   - a newly published catalog app gains its sync-managed published record;
#   - a withdrawn app loses its sync-managed record (curated records are
#     reverted to early-testing, never deleted);
#   - no changes -> no commit (fully idempotent).
# The committed data/** change then triggers the standard Pages deploy
# (deploy.yml) — no separate deployment path exists.
#
# Triggers:
#   - scheduled (every 6 hours) so public releases propagate without any
#     manual action;
#   - workflow_dispatch so the Publisher Console Lab section (via the
#     Worker /lab/sync endpoint) and operators can force a refresh.
#
# Failure behaviour: the sync script aborts on any catalog read/parse
# failure BEFORE writing, so a failed run never produces a false
# zero-count overwrite; valid committed data is never replaced by empty
# or malformed output.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit + push the derived data
  actions: write    # dispatch the existing deploy.yml (workflow_dispatch)

concurrency:
  group: 'lab-sync'
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (full history — the engineering mirror reads retired-record history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync published roadmap records from the catalog
        run: node scripts/sync-published-lab.mjs

      - name: Regenerate engineering mirror data
        run: python3 scripts/generate-engineering-data.py

      - name: Commit only when the sync produced changes
        id: sync
        run: |
          set -euo pipefail
          # Fail closed: never commit or deploy a payload that cannot be parsed.
          for f in data/upcoming-apps.json data/lab-apps.json data/engineering-status.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error::Invalid JSON in $f - refusing to commit or deploy"; exit 1; }
          done
          git config user.name "appmintly-lab-sync"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/upcoming-apps.json data/lab-apps.json data/engineering-status.json
            git commit -m "lab-sync: synchronize Published/Released records from the production catalog (automated)"
            git push
            echo "sync=committed" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "In sync - no changes to commit."
            echo "sync=in-sync" >> "$GITHUB_OUTPUT"
          fi

      # The push above is made with GITHUB_TOKEN, which never triggers the
      # push-driven deploy.yml. workflow_dispatch is the documented exception
      # (its events always create a run), so the deployment is requested
      # explicitly and then watched to a definite result.
      - name: Deploy the committed data through the existing production workflow
        if: steps.sync.outputs.sync == 'committed'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.sync.outputs.commit }}
        run: |
          set -euo pipefail
          # Never queue a second deployment for a commit that already has one.
          inflight=$(gh run list --workflow=deploy.yml --limit 20 \
            --json headSha,status \
            --jq "[.[] | select(.headSha==\"$COMMIT\" and (.status==\"queued\" or .status==\"in_progress\"))] | length")
          if [ "${inflight:-0}" -gt 0 ]; then
            echo "Deployment for $COMMIT is already queued or running - not dispatching a duplicate."
            exit 0
          fi
          gh workflow run deploy.yml --ref main
          run_id=""
          for _ in $(seq 1 24); do
            run_id=$(gh run list --workflow=deploy.yml --limit 20 \
              --json databaseId,headSha,event \
              --jq "[.[] | select(.headSha==\"$COMMIT\" and .event==\"workflow_dispatch\")][0].databaseId // empty")
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::deploy.yml dispatch produced no run for $COMMIT"
            exit 1
          fi
          echo "Dispatched deploy.yml run $run_id for $COMMIT"
          gh run watch "$run_id" --exit-status --interval 15
