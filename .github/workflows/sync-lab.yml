name: Sync Lab Published from Catalog

# Phase 4 — automatic catalog synchronization for the AppMintly Lab
# "Published / Released" section.
#
# The roadmap dataset (data/upcoming-apps.json) is the single source of
# truth for the Lab page (static export — no backend). This workflow
# derives the published records from the authoritative production catalog
# (data/apps.json) and commits them idempotently:
#   - a newly published catalog app gains its sync-managed published record;
#   - a withdrawn app loses its sync-managed record (curated records are
#     reverted to early-testing, never deleted);
#   - no changes -> no commit (fully idempotent).
# The committed data/** change then triggers the standard Pages deploy
# (deploy.yml) — no separate deployment path exists.
#
# Triggers:
#   - scheduled (every 6 hours) so public releases propagate without any
#     manual action;
#   - workflow_dispatch so the Publisher Console Lab section (via the
#     Worker /lab/sync endpoint) and operators can force a refresh.
#
# Failure behaviour: the sync script aborts on any catalog read/parse
# failure BEFORE writing, so a failed run never produces a false
# zero-count overwrite; valid committed data is never replaced by empty
# or malformed output.

on:
  # 6-hourly fallback. Scheduled runs own scan_time freshness: they always
  # write a genuine last-scan timestamp, even when no catalogue data moved.
  schedule:
    - cron: '17 */6 * * *'
  # Instant path for genuine catalogue updates.
  push:
    branches:
      - main
    # Catalogue INPUTS only. The generated outputs (data/upcoming-apps.json,
    # data/lab-apps.json, data/engineering-status.json, data/engineering-events.json,
    # data/engineering-builds.json) are deliberately absent: they are this
    # workflow's own write targets, so triggering on them would be a self-trigger.
    paths:
      - 'data/apps.json'
      - 'data/publishers.json'
      - 'data/categories.json'
      - 'data/collections.json'
  # Manual runs stay supported exactly as before.
  workflow_dispatch:

permissions:
  contents: write   # commit + push the derived data
  actions: write    # dispatch the existing deploy.yml (workflow_dispatch)

concurrency:
  group: 'lab-sync'
  cancel-in-progress: false

jobs:
  sync:
    # Defensive loop guard. A push made with GITHUB_TOKEN cannot trigger a
    # workflow at all, so this is a second line of defence rather than the
    # primary one: a run started by the Actions bot is never a reason to scan.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (full history — the engineering mirror reads retired-record history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync published roadmap records from the catalog
        run: node scripts/sync-published-lab.mjs

      - name: Regenerate engineering mirror data
        run: python3 scripts/generate-engineering-data.py

      - name: Commit only when the sync produced changes
        id: sync
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # scan_time freshness belongs to the 6-hourly schedule (and to
          # engineering-data-refresh). A push-triggered scan that finds nothing
          # but a new timestamp is therefore no change at all, and must not
          # deploy: revert it and fall through to the in-sync branch.
          if [ "${EVENT_NAME}" = "push" ]; then
            changed="$(git status --porcelain data/ | awk '{print $2}')"
            if [ "${changed}" = "data/engineering-status.json" ]; then
              other="$(git diff -U0 -- data/engineering-status.json | grep -E '^[-+][^-+]' | grep -v 'scan_time' || true)"
              if [ -z "${other}" ]; then
                git checkout -- data/engineering-status.json
                echo "Push-triggered scan: only scan_time changed, and the schedule owns that - treating as no change."
              fi
            fi
          fi
          # Fail closed: never commit or deploy a payload that cannot be parsed.
          for f in data/upcoming-apps.json data/lab-apps.json data/engineering-status.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error::Invalid JSON in $f - refusing to commit or deploy"; exit 1; }
          done
          git config user.name "appmintly-lab-sync"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/upcoming-apps.json data/lab-apps.json data/engineering-status.json
            git commit -m "lab-sync: synchronize Published/Released records from the production catalog (automated)"
            git push
            echo "sync=committed" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "In sync - no changes to commit."
            echo "sync=in-sync" >> "$GITHUB_OUTPUT"
          fi

      # The push above is made with GITHUB_TOKEN, which never triggers the
      # push-driven deploy.yml. workflow_dispatch is the documented exception
      # (its events always create a run), so the deployment is requested
      # explicitly and then watched to a definite result.
      - name: Deploy the committed data through the existing production workflow
        if: steps.sync.outputs.sync == 'committed'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.sync.outputs.commit }}
        run: |
          set -euo pipefail
          # deploy.yml builds ref main, so main must still contain the scan
          # commit. If it moved, the deploy is a superset (never a stale tree),
          # and we say so instead of silently deploying something else.
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${remote_sha}" != "${COMMIT}" ]; then
            echo "::warning::main advanced to ${remote_sha} after scan commit ${COMMIT}; deploying ${remote_sha} (a superset of the scanned data)."
          fi
          echo "scan commit : ${COMMIT}"
          echo "deploy ref  : ${remote_sha}"
          # Never queue a second deployment for a commit that already has one.
          inflight=$(gh run list --workflow=deploy.yml --limit 20 \
            --json headSha,status \
            --jq "[.[] | select(.headSha==\"$remote_sha\" and (.status==\"queued\" or .status==\"in_progress\"))] | length")
          if [ "${inflight:-0}" -gt 0 ]; then
            echo "Deployment for $remote_sha is already queued or running - not dispatching a duplicate."
            exit 0
          fi
          # True when commit $1 already contains the scan commit.
          contains_commit() {
            [ -n "${1:-}" ] || return 1
            local status
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${remote_sha}...$1" --jq '.status' 2>/dev/null || echo unknown)
            [ "$status" = "ahead" ] || [ "$status" = "identical" ]
          }

          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            gh workflow run deploy.yml --ref main
            run_id=""
            for _ in $(seq 1 24); do
              run_id=$(gh run list --workflow=deploy.yml --limit 20 \
                --json databaseId,headSha,event \
                --jq "[.[] | select(.headSha==\"$remote_sha\" and .event==\"workflow_dispatch\")][0].databaseId // empty")
              [ -n "$run_id" ] && break
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "::error::deploy.yml dispatch produced no run for $remote_sha"
              exit 1
            fi
            echo "Dispatched deploy.yml run $run_id for $remote_sha (attempt $attempt/$attempts)"

            set +e
            gh run watch "$run_id" --exit-status --interval 15
            watch_rc=$?
            set -e
            if [ "$watch_rc" -eq 0 ]; then
              echo "Deployment run $run_id succeeded for $remote_sha"
              exit 0
            fi

            conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion' 2>/dev/null || echo unknown)
            # A cancel is normally a newer arrival taking the shared 'pages'
            # slot. If a successful deployment already contains this commit the
            # required content is live, so retrying would only churn.
            if [ "$conclusion" = "cancelled" ]; then
              while read -r sha; do
                if contains_commit "$sha"; then
                  echo "::warning::run $run_id was cancelled, but deployment $sha already contains $remote_sha"
                  exit 0
                fi
              done <<< "$(gh run list --workflow=deploy.yml --limit 10 --json headSha,conclusion \
                --jq '[.[] | select(.conclusion=="success")][].headSha')"
              if [ "$attempt" -lt "$attempts" ]; then
                echo "::warning::run $run_id was cancelled and no successful deployment contains $remote_sha yet; retrying"
                continue
              fi
            fi
            echo "::error::deployment run $run_id for $remote_sha concluded '${conclusion}' (watch exit ${watch_rc})"
            exit 1
          done
          echo "::error::no successful deployment for $remote_sha after $attempts attempts"
          exit 1
