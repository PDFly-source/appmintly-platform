name: Production APK Release
run-name: Release ${{ inputs.app_name }} v${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Application label (for example Studyria)
        required: true
        type: string
      package_id:
        description: Android package identifier (must match marketplace metadata)
        required: true
        type: string
      version_name:
        description: Android version name (x.y.z)
        required: true
        type: string
      source_url:
        description: HTTPS launch URL (the exact URL verified on device)
        required: true
        type: string
      icon_url:
        description: Optional HTTPS icon URL
        required: false
        type: string
      theme_color:
        description: Optional theme color
        required: false
        type: string
      background_color:
        description: Optional background color
        required: false
        type: string
      release_tag:
        description: Optional release tag (defaults to <slug>-v<x.y.z>)
        required: false
        type: string
      distribution_repo:
        description: Public APK distribution repository (owner/name)
        required: true
        default: PDFly-source/appmintly-releases
        type: string
      welcome_headline:
        description: Optional one-time welcome screen headline (empty = no welcome screen)
        required: false
        type: string
      welcome_tagline:
        description: Optional welcome screen tagline
        required: false
        type: string
      welcome_body:
        description: Optional welcome screen supporting copy
        required: false
        type: string
      welcome_cta:
        description: Optional welcome screen CTA label
        required: false
        type: string

      slug:
        description: Catalog slug the profile is keyed by (for example nexdrop)
        required: false
        default: ''
        type: string
      native_artifact:
        description: Artifact id inside the native profile (app, tv, ...)
        required: false
        default: 'app'
        type: string
      native_project_path:
        description: Gradle project path inside the native repository
        required: false
        default: android
        type: string
      native_expected_fingerprint:
        description: Expected signer SHA-256 fingerprint; publishing is refused when it differs
        required: false
        default: ''
        type: string
      native_project_repo:
        description: Build from a native Android Gradle project (owner/name) instead of the WebView wrapper
        required: false
        default: ''
        type: string
      native_project_ref:
        description: Branch, tag or SHA of the native Android project
        required: false
        default: main
        type: string
      native_gradle_task:
        description: Gradle task for the native release build
        required: false
        default: ':app:assembleRelease'
        type: string
      native_version_code:
        description: versionCode stamped on the native APK (must exceed the published wrapper code)
        required: false
        default: ''
        type: string
      native_launcher_source:
        description: Path inside the native project whose launcher artwork the icon gate compares against
        required: false
        default: app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
        type: string
      dry_run:
        description: Build and validate only - do not publish, update the catalog or emit release events
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.package_id }}
  cancel-in-progress: false

env:
  APP_NAME: ${{ inputs.app_name }}
  PACKAGE_ID: ${{ inputs.package_id }}
  VERSION_NAME: ${{ inputs.version_name }}
  SOURCE_URL: ${{ inputs.source_url }}
  ICON_URL: ${{ inputs.icon_url }}
  THEME_COLOR: ${{ inputs.theme_color }}
  BACKGROUND_COLOR: ${{ inputs.background_color }}
  DISTRIBUTION_REPO: ${{ inputs.distribution_repo }}
  WELCOME_HEADLINE: ${{ inputs.welcome_headline }}
  WELCOME_TAGLINE: ${{ inputs.welcome_tagline }}
  WELCOME_BODY: ${{ inputs.welcome_body }}
  WELCOME_CTA: ${{ inputs.welcome_cta }}
  SIGNING_MODE: release
  APK_ARTIFACT_ONLY: '1'
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk


jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick zip unzip

      - name: Verify compiler and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -x "$JAVA_HOME/bin/javac"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          for tool in aapt zipalign apksigner; do
            test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/$tool"
          done

      - name: Verify required production secrets exist
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1" hint="$2" value="$3"
            if [[ -z "$value" ]]; then
              echo "MISSING SECRET: $name — $hint" >&2
              missing=1
            fi
          }
          check ANDROID_KEYSTORE_BASE64 'base64 of the production keystore file' "$ANDROID_KEYSTORE_BASE64"
          check KEYSTORE_PASSWORD 'password of the production keystore' "$KEYSTORE_PASSWORD"
          check KEY_ALIAS 'release key alias inside the production keystore' "$KEY_ALIAS"
          check KEY_PASSWORD 'password of the release key' "$KEY_PASSWORD"
          check DISTRIBUTION_REPO_TOKEN 'fine-grained PAT with Contents:write on the public distribution repository' "$DISTRIBUTION_TOKEN"
          if [[ "$missing" -ne 0 ]]; then
            echo '' >&2
            echo 'Production release aborted: required GitHub Actions secrets are missing.' >&2
            echo 'Add them under: Repository -> Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret' >&2
            exit 1
          fi

      - name: Prepare compiler and production signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-build"
          curl --fail --location --silent --show-error \
            'https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar' \
            -o "$RUNNER_TEMP/android-build/r8.jar"
          test -s "$RUNNER_TEMP/android-build/r8.jar"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-build/signing.keystore"
          test -s "$RUNNER_TEMP/android-build/signing.keystore"
          # Fail now if the keystore/alias/password combination is invalid.
          keytool -list -keystore "$RUNNER_TEMP/android-build/signing.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "R8_JAR=$RUNNER_TEMP/android-build/r8.jar" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-build/signing.keystore" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: WebView ownership anti-regression gate (fail-closed)
        if: inputs.native_project_repo == ''
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-webview-ownership.ts "$SOURCE_URL"

      - name: Launcher-icon gate (fail-closed on placeholder icons)
        if: inputs.native_project_repo == ''
        # CineFlow v0.2.0 shipped a generic "C" tile because the dispatched
        # icon URL 404'd and the letter-tile fallback was silently accepted.
        # This gate refuses a release build without real icon artwork.
        run: |
          set -euo pipefail
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-apk-icons.ts

      - name: Premium launch experience anti-regression gate (splash + welcome)
        if: inputs.native_project_repo == ''
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-launch-template.ts

      - name: Default the marketplace launcher icon URL (Phase 12.17 fail-closed fix)
        shell: bash
        run: |
          if [[ -z "$ICON_URL" && "$PACKAGE_ID" == "com.appmintly.appmintly" ]]; then
            echo "ICON_URL=https://appmintly.pages.dev/icon-512.png" >> "$GITHUB_ENV"
            echo 'ICON_URL input was empty (the v1.0.5 generic-letter root cause); defaulted to the official AppMintly launcher icon.'
          fi

      - name: Native build contract (profile, identity, version, repository)
        if: inputs.native_project_repo != ''
        shell: bash
        run: |
          set -euo pipefail
          # Version safety must compare against what is actually published, so read
          # the catalog from origin/main instead of this checkout's copy.
          git fetch --depth=1 origin main
          git show origin/main:data/apps.json > "$RUNNER_TEMP/published-apps.json"
          node scripts/build-profile.mjs validate --catalog "$RUNNER_TEMP/published-apps.json"
          node scripts/build-profile.mjs assert-version "${{ inputs.slug }}" \
            --artifact "${{ inputs.native_artifact }}" \
            --version-code "${{ inputs.native_version_code }}" \
            --catalog "$RUNNER_TEMP/published-apps.json"
          node scripts/build-profile.mjs assert-repository "${{ inputs.slug }}" \
            --artifact "${{ inputs.native_artifact }}" \
            --repo "${{ inputs.native_project_repo }}" \
            --ref "${{ inputs.native_project_ref }}" \
            --task "${{ inputs.native_gradle_task }}" \
            --project-path "${{ inputs.native_project_path }}" \
            --dry-run "${{ inputs.dry_run }}"

      - name: Checkout native Android project
        if: inputs.native_project_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.native_project_repo }}
          ref: ${{ inputs.native_project_ref }}
          path: native
          fetch-depth: 1
          persist-credentials: false

      - name: Compile production-signed native APK
        if: inputs.native_project_repo != ''
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist/apk
          APP_FILE="${APP_NAME//[^[:alnum:]]/}-${VERSION_NAME}.apk"
          # The native project reads its keystore from NEXDROP_* env vars and
          # stamps versionCode/versionName from the -P overrides below, so the
          # release identity always comes from this workflow, never the checkout.
          # Isolated per-app signing: never borrow the AppMintly wrapper keystore
          # (different alias; signing native with it breaks upgrades).
          KS_B64="${{ secrets.NEXDROP_KEYSTORE_BASE64 }}"
          if [ -z "$KS_B64" ]; then
            echo "::error::NEXDROP_KEYSTORE_BASE64 is not configured; the native kernel needs its own signing identity (NEXDROP_KEYSTORE_BASE64, NEXDROP_KEYSTORE_PASSWORD, NEXDROP_KEY_PASSWORD)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nx-sign"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/nx-sign/nexdrop.jks"
          export NEXDROP_KEYSTORE_FILE="$RUNNER_TEMP/nx-sign/nexdrop.jks"
          export NEXDROP_KEYSTORE_PASSWORD="${{ secrets.NEXDROP_KEYSTORE_PASSWORD }}"
          export NEXDROP_KEY_PASSWORD="${{ secrets.NEXDROP_KEY_PASSWORD }}"
          cd "native/${{ inputs.native_project_path }}"
          ./gradlew --no-daemon --stacktrace "${{ inputs.native_gradle_task }}" \
            -PversionNameOverride="${VERSION_NAME}" \
            -PversionCodeOverride="${{ inputs.native_version_code }}"
          APK="$(find . -path '*build/outputs/apk/release/*.apk' -type f | head -1)"
          test -s "$APK" || { echo "::error::native release build produced no APK"; exit 1; }
          cp "$APK" "../dist/apk/$APP_FILE"
          ls -l "../dist/apk/$APP_FILE"

      - name: Native APK security gate (fail-closed)
        if: inputs.native_project_repo != ''
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/apk/${APP_NAME//[^[:alnum:]]/}-${VERSION_NAME}.apk"
          GATE_ARGS="$(node scripts/build-profile.mjs gate-args "${{ inputs.slug }}" --artifact "${{ inputs.native_artifact }}")"
          EXTRA=()
          if [ -n "${{ inputs.native_expected_fingerprint }}" ]; then
            EXTRA=(--expected-fingerprint "${{ inputs.native_expected_fingerprint }}")
          fi
          # shellcheck disable=SC2086
          node scripts/verify-native-apk.mjs --apk "$APK" \
            --package "${{ inputs.package_id }}" \
            --version-code "${{ inputs.native_version_code }}" \
            --version-name "${{ inputs.version_name }}" \
            $GATE_ARGS "${EXTRA[@]}"

      - name: Verify native APK identity (package, versionCode, real bytecode)
        if: inputs.native_project_repo != ''
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/apk/${APP_NAME//[^[:alnum:]]/}-${VERSION_NAME}.apk"
          BUILDTOOLS="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | tail -1)"
          AAPT2="$BUILDTOOLS/aapt2"
          test -x "$AAPT2" || { echo "::error::aapt2 not found"; exit 1; }
          "$AAPT2" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "package: name='${PACKAGE_ID}'" /tmp/badging.txt || { echo "::error::package id is not ${PACKAGE_ID}"; exit 1; }
          grep -q "versionCode='${{ inputs.native_version_code }}'" /tmp/badging.txt || { echo "::error::versionCode is not ${{ inputs.native_version_code }}"; exit 1; }
          unzip -l "$APK" | grep -q 'classes.*\\.dex' || { echo "::error::APK carries no bytecode"; exit 1; }
          echo "native APK identity verified: ${PACKAGE_ID} v${{ inputs.native_version_code }}"

      - name: Compile production-signed APK
        if: inputs.native_project_repo == ''
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/build-android-apk.ts
          APP_FILE="${APP_NAME//[^[:alnum:]]/}-${VERSION_NAME}.apk"
          test -s "dist/apk/$APP_FILE"
          test -s dist/apk/validation.json
          file "dist/apk/$APP_FILE"
          echo "APP_FILE=$APP_FILE" >> "$GITHUB_ENV"

      - name: Independent release validation of the signed binary
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/apk/$APP_FILE"

          # 1. Exists and is a real binary archive
          test -s "$APK"
          file "$APK" | grep -Ei 'zip archive|android'

          # 2. ZIP/APK integrity
          unzip -t "$APK" >/dev/null

          # 3. Zip alignment
          zipalign -c -v 4 "$APK" >/dev/null

          # 4. Manifest, package id, version name and version code
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep -E "^package: name='$PACKAGE_ID'"
          BADGE_VERSION_NAME="$(echo "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)' versionName='\([^']*\)'.*/\2/p")"
          BADGE_VERSION_CODE="$(echo "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)'.*/\1/p")"
          if [[ "$BADGE_VERSION_NAME" != "$VERSION_NAME" ]]; then
            echo "Version mismatch: APK reports '$BADGE_VERSION_NAME', expected '$VERSION_NAME'" >&2
            exit 1
          fi
          test -n "$BADGE_VERSION_CODE"
          # Modern target gate: legacy targets trigger the "built for an older
          # version of Android" install warning on device.
          BADGE_TARGET_SDK="$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
          if [[ -z "$BADGE_TARGET_SDK" || "$BADGE_TARGET_SDK" -lt 36 ]]; then
            echo "FATAL: APK targetSdkVersion '$BADGE_TARGET_SDK' is below the modern requirement 36." >&2
            exit 1
          fi
          BADGE_DEBUGGABLE="$(echo "$BADGING" | grep -c 'application-debuggable' || true)"
          if [[ "$BADGE_DEBUGGABLE" -ne 0 ]]; then
            echo 'FATAL: APK is debuggable.' >&2
            exit 1
          fi
          # The catalog must record the code from the actual binary, never a stale value
          echo "VERSION_CODE=$BADGE_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Package: $PACKAGE_ID | versionName: $BADGE_VERSION_NAME | versionCode: $BADGE_VERSION_CODE"

          # 5. DEX must exist and contain the FULL MainActivity class set (D8 multi-class fix)
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          test -s /tmp/classes.dex
          DEX_PATH="$(echo "$PACKAGE_ID" | tr '.' '/')"
          for cls in 'MainActivity' 'MainActivity$1' 'MainActivity$2' 'MainActivity$3'; do
            if ! grep -a -q "L${DEX_PATH}/${cls};" /tmp/classes.dex; then
              echo "FATAL: classes.dex is missing ${DEX_PATH}/${cls}. The D8 multi-class fix has regressed." >&2
              exit 1
            fi
          done
          echo "DEX check passed: MainActivity + all listener inner classes are packaged"

          # 6. Signature must verify and must be a production key, never a debug key
          CERTS="$(apksigner verify --print-certs "$APK")" || { echo 'apksigner verification FAILED' >&2; exit 1; }
          if echo "$CERTS" | grep -Eiq 'CN=Android Debug|CN=AppForge Debug|CN=Debug'; then
            echo 'FATAL: APK is signed with a DEBUG certificate. Production releases must use the production keystore.' >&2
            exit 1
          fi
          apksigner verify -v "$APK" | grep -E 'Verified using v[0-9]+ scheme' || true

          # 6. Cross-check against the build validator output
          node -e '
            const v = require("./dist/apk/validation.json");
            if (v.signingMode !== "release") { console.error("validation.json is not a release build"); process.exit(1); }
            if (v.fileName !== process.env.APP_FILE) { console.error("validation.json file name mismatch"); process.exit(1); }
            if (!v.validation || v.validation.valid !== true) { console.error("Build validator did not pass"); process.exit(1); }
            if (v.validation.packageId !== process.env.PACKAGE_ID) { console.error("Validator package id mismatch"); process.exit(1); }
            if (v.validation.versionName !== process.env.VERSION_NAME) { console.error("Validator version mismatch"); process.exit(1); }
            console.log("Cross-checked validation.json: OK");
          '

          # 7. Final checksum and size from the actual signed binary
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          test "${#SHA256}" -eq 64
          test "$SIZE" -gt 45000
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "Validated $APP_FILE: $SIZE bytes, SHA-256 $SHA256"

      - name: Launcher icon composition gate (fail-closed, packaged APK must carry symbol, wordmark and tagline)
        # 0.2.4 shipped 17 individually-correct launcher resources and still
        # rendered as the symbol alone: the three-element lockup was squeezed into
        # about 43% of Android's adaptive safe circle, leaving the tagline ~1px at
        # launcher size. Counting files cannot detect that, so this gate reads the
        # packaged PNGs and fails unless the whole stack is really there.
        shell: bash
        run: |
          set -euo pipefail
          SRC_ARG=()
          if [ -n "${{ inputs.native_project_repo }}" ]; then
            SRC_ARG=(--source "native/${{ inputs.native_launcher_source }}")
          fi
          node scripts/verify-apk-launcher-composition.mjs --apk "dist/apk/$APP_FILE" "${SRC_ARG[@]+"${SRC_ARG[@]}"}"

      - name: APK security gate (fail-closed pre-publish scan)
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/apk/$APP_FILE"
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("dist/apk/validation.json", "utf8"));
            const g = v.securityCheck || {};
            const rows = [
              ["Target SDK", g.targetSdk, v.targetSdk],
              ["Min SDK", g.minSdk, v.minSdk],
              ["Debuggable", g.debuggable, ""],
              ["TestOnly", g.testOnly, ""],
              ["Signing", g.signing, "v1=" + v.signatureSchemes?.v1 + " v2=" + v.signatureSchemes?.v2 + " v3=" + v.signatureSchemes?.v3],
              ["Certificate", g.certificate, "CN=" + v.certificateSubject],
              ["Signature", g.signature, ""],
              ["Permissions", g.permissions, (v.permissions || []).join(", ")],
              ["Embedded secrets", g.embeddedSecrets, ""],
              ["Development URLs", g.developmentUrls, ""],
              ["APK structure", g.apkStructure, ""],
              ["Package", g.packageName, v.packageName],
              ["Version", g.version, v.validation.versionName + " / " + v.validation.versionCode],
              ["SHA-256", g.sha256, v.sha256],
            ];
            console.log("APK SECURITY STATUS");
            console.log("==================");
            for (const [name, status, detail] of rows) {
              console.log(name.padEnd(18) + ": " + String(status).padEnd(4) + " " + detail);
            }
            console.log("");
            const eligible = g.eligible === true && v.validation.valid === true;
            console.log("Final release eligibility: " + (eligible ? "PASS" : "FAIL") + " (validator " + (g.validatorVersion || "?") + ")");
            if (!eligible) { console.error("BLOCKED: mandatory security gate failed. Publishing is stopped."); process.exit(1); }
          '
          # Independent certificate pin: the workflow itself re-verifies the
          # production signing identity, not only the build validator.
          CERT_FP="$(apksigner verify --print-certs "$APK" | sed -n "s/.*SHA-256 digest: \([0-9a-f]\{64\}\).*/\1/p" | head -n1)"
          if [[ "$CERT_FP" != "dbafc6d389516069518826d1e1320cebcf7970eec9249d749de699b730f61368" ]]; then
            echo "FATAL: signing certificate fingerprint '$CERT_FP' is not the AppMintly production identity." >&2
            exit 1
          fi
          echo "Production certificate fingerprint verified: ${CERT_FP:0:16}..."
          # Expose evidence for the catalog update step
          node -e '
            const v = JSON.parse(require("fs").readFileSync("dist/apk/validation.json", "utf8"));
            const g = v.securityCheck;
            const out = [
              "TARGET_SDK=" + v.targetSdk,
              "MIN_SDK=" + v.minSdk,
              "CERT_SUBJECT=" + v.certificateSubject,
              "CERT_FINGERPRINT=" + v.certificateSha256Fingerprint,
              "SIG_V1=" + v.signatureSchemes.v1, "SIG_V2=" + v.signatureSchemes.v2, "SIG_V3=" + v.signatureSchemes.v3,
              "SECURITY_STATUS=" + (g.eligible ? "passed" : "failed"),
              "SECURITY_TIMESTAMP=" + g.checkedAt,
              "VALIDATOR_VERSION=" + g.validatorVersion,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_ENV, "\n" + out + "\n");
          '

      - name: Publish APK to the public distribution repository
        if: inputs.dry_run != true
        shell: bash
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$DISTRIBUTION_REPO"
          AUTH="Authorization: Bearer $DISTRIBUTION_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          SLUG="$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g')"
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then TAG="${SLUG}-v${VERSION_NAME}"; fi
          APK="dist/apk/$APP_FILE"

          # Locate or create the release (immutable tag per version)
          CODE="$(curl -s -o /tmp/release.json -w '%{http_code}' -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$TAG")"
          if [[ "$CODE" != "200" ]]; then
            echo "Creating release $TAG in $DISTRIBUTION_REPO"
            curl -sf -H "$AUTH" -H "$ACCEPT" -X POST "$API/releases" -d @- > /tmp/release.json <<JSON
          {
            "tag_name": "$TAG",
            "target_commitish": "main",
            "name": "$APP_NAME $VERSION_NAME",
            "body": "Production release of $APP_NAME $VERSION_NAME.\n\n- Package: $PACKAGE_ID\n- Version: $VERSION_NAME\n- File: $APP_FILE\n- SHA-256: $SHA256\n- Size: $SIZE bytes"
          }
          JSON
          fi
          RELEASE_ID="$(node -e 'console.log(require("/tmp/release.json").id)')"
          test -n "$RELEASE_ID"

          # Replace an existing asset with the same name so re-runs stay idempotent
          ASSET_ID="$(node -e 'const r=require("/tmp/release.json");const a=(r.assets||[]).find(x=>x.name===process.env.APP_FILE);console.log(a?a.id:"")')"
          if [[ -n "$ASSET_ID" ]]; then
            echo "Replacing existing release asset $APP_FILE"
            curl -sf -H "$AUTH" -X DELETE "$API/releases/assets/$ASSET_ID"
            sleep 2
          fi

          # Upload the real APK binary with the Android package MIME type
          UPLOAD_URL="$(node -e 'console.log(require("/tmp/release.json").upload_url.split("{")[0])')"
          curl -sf -H "$AUTH" -H "Content-Type: application/vnd.android.package-archive" \
            -X POST --data-binary @"$APK" "${UPLOAD_URL}?name=$APP_FILE" > /tmp/asset.json
          node -e 'const a=require("/tmp/asset.json");if(!a.id){console.error("Asset upload failed");process.exit(1)};console.log("Asset id: "+a.id+" state: "+a.state)'

          PUBLIC_URL="https://github.com/$DISTRIBUTION_REPO/releases/download/$TAG/$APP_FILE"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          RELEASE_ID="$(node -e 'console.log(require("/tmp/release.json").id)')"
          ASSET_ID2="$(node -e 'console.log(require("/tmp/asset.json").id)')"
          echo "GH_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "GH_ASSET_ID=$ASSET_ID2" >> "$GITHUB_ENV"
          echo "Published $APP_FILE to $PUBLIC_URL (release $RELEASE_ID, asset $ASSET_ID2)"

      - name: Verify anonymous public download is byte-for-byte identical
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"

          # Anonymous GET (no token) must return the real APK
          CODE="$(curl -sL -o /tmp/downloaded.apk -w '%{http_code}' "$URL")"
          if [[ "$CODE" != "200" ]]; then
            echo "FATAL: public download returned HTTP $CODE for $URL" >&2
            exit 1
          fi

          # MIME type must be the Android package archive type, not HTML or text
          CT="$(curl -sIL "$URL" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print $2}' | tail -n1)"
          echo "Public Content-Type: $CT"
          case "$CT" in
            application/vnd.android.package-archive*) ;;
            *) echo "FATAL: public download does not serve application/vnd.android.package-archive" >&2; exit 1 ;;
          esac

          # Downloaded bytes must match the published binary exactly
          DL_SHA="$(sha256sum /tmp/downloaded.apk | cut -d' ' -f1)"
          if [[ "$DL_SHA" != "$SHA256" ]]; then
            echo "FATAL: downloaded SHA-256 $DL_SHA != published SHA-256 $SHA256" >&2
            exit 1
          fi
          cmp "dist/apk/$APP_FILE" /tmp/downloaded.apk

          # Content-Disposition must be an attachment of the real APK file
          CD="$(curl -sIL "$URL" | tr -d '\r' | awk 'tolower($1)=="content-disposition:"{$1="";print}' | tail -n1 | xargs)"
          echo "Public Content-Disposition: $CD"
          if [[ "$CD" != attachment* ]]; then
            echo 'FATAL: public download is not served as an attachment' >&2
            exit 1
          fi

          # No HTML masquerading as an APK: first bytes must be the ZIP magic PK
          MAGIC="$(head -c 2 /tmp/downloaded.apk | od -An -tx1 | tr -d ' \n')"
          if [[ "$MAGIC" != "504b" ]]; then
            echo "FATAL: downloaded file is not a ZIP/APK binary (magic: $MAGIC)" >&2
            exit 1
          fi
          echo "Anonymous public download verified: $URL ($SIZE bytes, SHA-256 $SHA256)"

      - name: Update marketplace catalog metadata
        if: inputs.dry_run != true
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-apk-release-metadata.mjs \
            --package-id "$PACKAGE_ID" \
            --file-name "$APP_FILE" \
            --url "$PUBLIC_URL" \
            --sha256 "$SHA256" \
            --size "$SIZE" \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --tag "$RELEASE_TAG" \
            --min-sdk "$MIN_SDK" \
            --target-sdk "$TARGET_SDK" \
            --cert-subject "$CERT_SUBJECT" \
            --cert-fingerprint "$CERT_FINGERPRINT" \
            --sig-v1 "$SIG_V1" --sig-v2 "$SIG_V2" --sig-v3 "$SIG_V3" \
            --security-status "$SECURITY_STATUS" \
            --security-timestamp "$SECURITY_TIMESTAMP" \
            --validator-version "$VALIDATOR_VERSION" \
            --release-id "$GH_RELEASE_ID" \
            --asset-id "$GH_ASSET_ID"
          git config user.name "appmintly-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/apps.json; then
            echo "Catalog metadata already up to date"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/apps.json
            git commit -m "release: $APP_NAME $VERSION_NAME production APK published and verified ($RELEASE_TAG)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # The catalog commit is pushed with this run's GITHUB_TOKEN, which cannot
      # trigger another workflow, so the production deployment must be
      # dispatched explicitly. Unlike a fire-and-forget dispatch, this waits for
      # the run to conclude and fails the release when the deployment does not
      # actually happen. A cancelled run (a later Pages deployment superseding
      # it) is retried; a failed one is reported, never swallowed.
      - name: Verify the production deployment for this release
        if: (github.event_name == 'workflow_dispatch' && steps.catalog.outputs.committed == 'true') && inputs.dry_run != true
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.catalog.outputs.commit_sha }}
        run: |
          set -euo pipefail
          [ -n "${COMMIT:-}" ] || { echo "::error::catalog step reported no commit SHA"; exit 1; }
          echo "Release catalog commit: $COMMIT"

          # The deployment must cover this commit: compare(base=COMMIT, head=main).
          on_main=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${COMMIT}...main" --jq '.status')
          case "$on_main" in
            ahead|identical) echo "Confirmed: $COMMIT is contained in main ($on_main)." ;;
            *) echo "::error::$COMMIT is not contained in main (compare status: $on_main) - refusing to deploy"; exit 1 ;;
          esac

          for attempt in 1 2 3; do
            # Idempotent: never queue a duplicate for a commit that already has a
            # successful deployment or one still in flight.
            done_ok=$(gh run list --workflow=deploy.yml --limit 30 \
              --json headSha,conclusion \
              --jq "[.[] | select(.headSha==\"${COMMIT}\" and .conclusion==\"success\")] | length")
            if [ "${done_ok:-0}" -gt 0 ]; then
              echo "A successful production deployment already exists for ${COMMIT}; not dispatching a duplicate."
              exit 0
            fi

            run_id=$(gh run list --workflow=deploy.yml --limit 30 \
              --json databaseId,headSha,status \
              --jq "[.[] | select(.headSha==\"${COMMIT}\" and (.status==\"queued\" or .status==\"in_progress\"))][0].databaseId // empty")
            if [ -n "${run_id}" ]; then
              echo "Tracking in-flight deployment run ${run_id} for ${COMMIT}."
            else
              gh workflow run deploy.yml --ref main
              run_id=""
              for _ in $(seq 1 24); do
                run_id=$(gh run list --workflow=deploy.yml --limit 30 \
                  --json databaseId,headSha,event \
                  --jq "[.[] | select(.headSha==\"${COMMIT}\" and .event==\"workflow_dispatch\")][0].databaseId // empty")
                [ -n "${run_id}" ] && break
                sleep 5
              done
              [ -n "${run_id}" ] || { echo "::error::deploy.yml dispatch produced no run for ${COMMIT}"; exit 1; }
              echo "Dispatched deploy.yml run ${run_id} for ${COMMIT}."
            fi

            set +e
            gh run watch "${run_id}" --exit-status --interval 15
            watch_rc=$?
            set -e

            # Prove the run really built this release (or a superset of it).
            actual_sha=$(gh run view "${run_id}" --json headSha --jq '.headSha')
            if [ "${actual_sha}" = "${COMMIT}" ]; then
              echo "Run ${run_id} built the release commit ${COMMIT}."
            else
              covers=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${COMMIT}...${actual_sha}" --jq '.status')
              case "$covers" in
                ahead|identical) echo "::warning::run ${run_id} built ${actual_sha}, a superset of ${COMMIT} (main advanced)." ;;
                *) echo "::error::run ${run_id} built ${actual_sha}, which does not contain ${COMMIT}"; exit 1 ;;
              esac
            fi

            if [ "${watch_rc}" -eq 0 ]; then
              echo "Production deployment ${run_id} succeeded for ${COMMIT}."
              exit 0
            fi

            conclusion=$(gh run view "${run_id}" --json conclusion --jq '.conclusion')
            if [ "${conclusion}" = "cancelled" ] && [ "${attempt}" -lt 3 ]; then
              echo "::warning::deployment ${run_id} for ${COMMIT} was cancelled, most likely superseded by a later Pages deployment. Re-dispatching (attempt $((attempt+1))/3)."
              continue
            fi
            echo "::error::deployment ${run_id} for ${COMMIT} concluded '${conclusion}' (watch exit ${watch_rc})"
            exit 1
          done
          echo "::error::no successful production deployment for ${COMMIT} after 3 attempts"
          exit 1

      # Emits the public release event for this genuinely published release.
      # Signs with the same HMAC contract the Worker verifies; the secret is
      # read from the environment only and is never printed or written to disk.
      # The event id is derived from (app, platform, version, catalog revision),
      # so a re-run of this step is idempotent and cannot duplicate the feed.
      - name: Publish release event
        if: (steps.catalog.outputs.committed == 'true') && inputs.dry_run != true
        env:
          # GitHub stores this as EVENT_EMISSION_SECRET (documented in worker.js:2290
          # and wrangler.toml:45); the shell variable keeps the Worker-side name.
          APPMINTLY_EVENTS_EMISSION_SECRET: ${{ secrets.EVENT_EMISSION_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APPMINTLY_EVENTS_EMISSION_SECRET:-}" ]; then
            echo "::error::The release is published in the catalog, but no release event was emitted: the EVENT_EMISSION_SECRET repository secret is not configured. Add it (same value as the Worker secret APPMINTLY_EVENTS_EMISSION_SECRET) and re-run this job."
            exit 1
          fi
          node scripts/publish-release-event.mjs \
            --catalog data/apps.json \
            --package-id "$PACKAGE_ID" \
            --app-name "$APP_NAME" \
            --version "$VERSION_NAME" \
            --revision "$(git rev-parse HEAD)"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Production release published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| App | $APP_NAME |"
            echo "| Package | $PACKAGE_ID |"
            echo "| Version | $VERSION_NAME |"
            echo "| Release tag | $RELEASE_TAG |"
            echo "| Public URL | $PUBLIC_URL |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo "| Size | $SIZE bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
