# AppMintly Phase 12.4 — isolated Android notification runtime test.
#
# MANUALLY TRIGGERED ONLY (workflow_dispatch). Touches nothing in production:
# it installs the already-released AppMintly APKs (v1.0.3 -> v1.0.4 in-place
# upgrade), reads the production catalog read-only, and confines ALL test
# state to a disposable emulator's local SharedPreferences (the isolated
# fixture). No APK build, no signing, no catalog writes, no push provider,
# no real users.
#
# Honest-scope notes encoded in the test:
#  - The ~6h alarm is verified as SCHEDULED (dumpsys) and RESCHEDULED after
#    reboot. Its actual firing is NEVER claimed — checks are forced through
#    the same AlarmReceiver broadcast the alarm uses, and the firing is
#    reported as NOT TESTED (out of run budget).
#  - The fixture sets tracked apps to genuinely older, previously-real
#    versions (appmintly 1.0.3, studyria 2.0.1, pdfminifly 2.1.0) so the
#    REAL native engine, REAL OS notification path and REAL catalog produce
#    genuine "Update available" notifications. No test records are inserted
#    into the production catalog.
#  - Broadcasts use --include-stopped-packages purely as the test trigger
#    mechanism; the code path exercised is the production AlarmReceiver.
#  - The final "Evaluate" step is the authoritative gate: the job FAILS
#    when any required scenario lacks genuine evidence.
#
# Implementation note: the emulator runner executes the script line-by-line
# (each line via sh -c), so every command below is a SINGLE line — no
# multi-line if/then or backslash continuations.
name: Test AppMintly Android notification runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Notification engine unit tests
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-notification-engine.ts

      - name: PKD catalog data validation
        run: node scripts/test-pkd-data.mjs

      - name: Publisher statistics gate
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-publisher-stats.ts

      - name: WebView ownership gate
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-webview-ownership.ts https://appmintly.pages.dev/

      # Mirrors the production GitHub Pages build gate exactly (deploy.yml):
      # API routes are server-side publisher tooling excluded from the static
      # export; the catalog is shipped as static data.
      - name: Production static-export build check
        run: rm -rf app/api && NEXT_OUTPUT=export NEXT_PUBLIC_BASE_PATH=/appmintly-platform npm run build

  notification-smoke:
    runs-on: ubuntu-24.04
    needs: static-gates
    timeout-minutes: 75
    steps:
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download released AppMintly APKs (authoritative release assets, not rebuilt)
        run: |
          mkdir -p test-apk diag
          curl -fsSL -w 'v1.0.3 HTTP %{http_code} %{size_download} bytes\n' -o test-apk/AppMintly-1.0.3.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.3/AppMintly-1.0.3.apk"
          curl -fsSL -w 'v1.0.4 HTTP %{http_code} %{size_download} bytes\n' -o test-apk/AppMintly-1.0.4.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.4/AppMintly-1.0.4.apk"

      - name: Verify APK integrity (sha256, package, versionCode, signing certificate) BEFORE installation
        run: |
          pip install --quiet androguard
          python3 - <<'PY' 2>&1 | tee diag/apk-integrity.txt
          import hashlib
          from androguard.core.apk import APK
          import logging; logging.disable(logging.CRITICAL)
          EXPECTED = {
              "test-apk/AppMintly-1.0.3.apk": ("23ef68b76f109d9a7af68a49f094d5dc3a52bf02a2157ceb4de30ca2b7dfac1e", "10003", "1.0.3"),
              "test-apk/AppMintly-1.0.4.apk": ("eeca15eef78553e997d2b645fc409058e6c56ec05c9436c54ca3647659fd051b", "10004", "1.0.4"),
          }
          EXPECTED_CERT = "dbafc6d389516069518826d1e1320cebcf7970eec9249d749de699b730f61368"
          for f, (exp_hash, exp_vc, exp_vn) in EXPECTED.items():
              a = APK(f)
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              assert h == exp_hash, f"{f}: sha256 mismatch {h}"
              assert a.get_package() == "com.appmintly.appmintly", a.get_package()
              assert a.get_androidversion_code() == exp_vc, a.get_androidversion_code()
              assert a.get_androidversion_name() == exp_vn, a.get_androidversion_name()
              cert = hashlib.sha256((a.get_certificates_der_v2() or a.get_certificates_der())[0]).hexdigest()
              assert cert == EXPECTED_CERT, f"{f}: signer cert mismatch {cert}"
              print(f"VERIFIED {f}: sha256={h}")
              print(f"  package={a.get_package()} versionCode={exp_vc} versionName={exp_vn} targetSdk={a.get_target_sdk_version()}")
              print(f"  signerCert sha256={cert}")
          # v1.0.4 must carry the notification runtime declarations.
          a4 = APK("test-apk/AppMintly-1.0.4.apk")
          recv = [".AlarmReceiver", ".BootReceiver"]
          for r in recv:
              assert r in a4.get_receivers(), f"v1.0.4 missing receiver {r}: {a4.get_receivers()}"
          perms = a4.get_permissions()
          assert "android.permission.POST_NOTIFICATIONS" in perms, f"v1.0.4 missing POST_NOTIFICATIONS: {perms}"
          assert "android.permission.RECEIVE_BOOT_COMPLETED" in perms, f"v1.0.4 missing RECEIVE_BOOT_COMPLETED: {perms}"
          print(f"  v1.0.4 receivers={a4.get_receivers()}")
          print("APK-INTEGRITY: ALL PASS (hash, package, versionCode, signing certificate, receivers, permissions)")
          PY

      - name: Write helper scripts (fixture patcher, UI tapper, evidence evaluator)
        run: |
          cat > "$RUNNER_TEMP/patch_prefs.py" <<'PY'
          # Patch the app's LOCAL SharedPreferences inside the disposable
          # emulator (the isolated fixture). Ownership-preserving: writes via
          # `cat >` onto the app's own inode, so no uid lookup / chown is
          # needed (the earlier uid-parse approach failed on API 36 and
          # silently invalidated every fixture). The app is backgrounded and
          # killed with `am kill` — never force-stop, which would cancel the
          # app's alarms and put it in the stopped state.
          import subprocess, sys, time, tempfile
          import xml.etree.ElementTree as ET
          APK = "com.appmintly.appmintly"
          PREFS = "/data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml"
          def adb(*args):
              r = subprocess.run(["adb", *args], capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f"adb {' '.join(args)} failed: {r.stderr}")
              return r.stdout
          def sh(cmd):
              return subprocess.run(["adb", "shell", cmd], capture_output=True, text=True).stdout
          master, tracked_json, delivered_json, mode = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          sh("input keyevent KEYCODE_WAKEUP")
          sh("input keyevent KEYCODE_HOME")
          time.sleep(2)
          sh(f"am kill {APK}")
          time.sleep(2)
          alive = sh(f"pidof {APK}").strip()
          if alive:
              raise SystemExit(f"app process still alive after am kill (pid {alive}); refusing to patch")
          tmp = tempfile.mktemp(suffix=".xml")
          adb("pull", PREFS, tmp)
          text = open(tmp, encoding="utf-8").read()
          if "<map" not in text:
              raise SystemExit("prefs file missing; app never ran")
          root = ET.fromstring(text)
          def set_string(name, value):
              el = root.find(f"./string[@name='{name}']")
              if el is None:
                  el = ET.SubElement(root, "string", {"name": name})
              el.text = value
          def set_boolean(name, value):
              el = root.find(f"./boolean[@name='{name}']")
              if el is None:
                  el = ET.SubElement(root, "boolean", {"name": name})
              el.set("value", value)
          set_boolean("master", master)
          set_boolean("updates", "true")
          set_boolean("newAndroid", "true")
          set_boolean("newWeb", "true")
          set_boolean("important", "true")
          set_boolean("security", "true")
          set_string("tracked", tracked_json)
          set_string("delivered", delivered_json)
          # Sentinel: every real check overwrites lastCheckState with its own
          # outcome, so a lingering "fixture-pending" in the evidence means a
          # check never ran and the gate fails loudly instead of passing on
          # stale state.
          set_string("lastCheckState", "fixture-pending")
          el = root.find("./long[@name='lastCheck']")
          if el is not None:
              root.remove(el)
          el = root.find("./int[@name='lastPosted']")
          if el is not None:
              root.remove(el)
          if mode == "init":
              el = root.find("./string[@name='baseline']")
              if el is not None:
                  root.remove(el)
          out = tempfile.mktemp(suffix=".xml")
          open(out, "w", encoding="utf-8").write("<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n" + ET.tostring(root, encoding="unicode"))
          adb("push", out, "/data/local/tmp/fixture_prefs.xml")
          sh(f"cat /data/local/tmp/fixture_prefs.xml > {PREFS}")
          sh("rm -f /data/local/tmp/fixture_prefs.xml")
          check = sh(f"cat {PREFS}").replace("\r", "")
          ok = (f'name="master" value="{master}"' in check.replace("'", '"')) and tracked_json in check and "fixture-pending" in check
          if not ok:
              raise SystemExit("fixture verification failed: prefs read-back mismatch")
          print(f"FIXTURE-APPLIED mode={mode} master={master} tracked={tracked_json} delivered={delivered_json}")
          PY
          cat > "$RUNNER_TEMP/tap_node.py" <<'PY'
          # Find a UI node by text in a uiautomator dump (exact match first,
          # then substring) and tap its bounds center. Dumps retry internally:
          # WebView accessibility trees are known to need dump retries.
          import subprocess, sys, tempfile, time, re
          needle = sys.argv[1]
          def dump_xml():
              for attempt in range(4):
                  subprocess.run(["adb", "shell", "rm", "-f", "/sdcard/tapdump.xml"], capture_output=True)
                  subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/tapdump.xml"], capture_output=True)
                  tmp = tempfile.mktemp(suffix=".xml")
                  subprocess.run(["adb", "pull", "/sdcard/tapdump.xml", tmp], capture_output=True)
                  try:
                      xml = open(tmp, encoding="utf-8", errors="replace").read()
                      if xml.strip().startswith("<?xml") or "<hierarchy" in xml:
                          return xml
                  except FileNotFoundError:
                      pass
                  time.sleep(3)
              return ""
          xml = dump_xml()
          best = None
          for exact in (True, False):
              for node in re.finditer(r'<node[^>]*?/?>', xml):
                  tag = node.group(0)
                  tm = re.search(r'text="([^"]*)"', tag)
                  cm = re.search(r'content-desc="([^"]*)"', tag)
                  dm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
                  if not dm:
                      continue
                  texts = [t.group(1) for t in (tm, cm) if t]
                  if not texts:
                      continue
                  hit = any((t == needle) if exact else (needle in t) for t in texts)
                  if not hit:
                      continue
                  x1, y1, x2, y2 = (int(dm.group(i)) for i in range(1, 5))
                  if x2 > x1 and y2 > y1:
                      best = ((x1 + x2) // 2, (y1 + y2) // 2, texts[0])
                      break
              if best:
                  break
          if not best:
              print(f"NODE-NOT-FOUND: {needle}")
              sys.exit(1)
          x, y, txt = best
          subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], capture_output=True)
          print(f"TAPPED: '{txt}' at {x},{y}")
          PY
          cat > "$RUNNER_TEMP/evaluate_diag.py" <<'PY'
          # Authoritative gate: reads the diag evidence produced inside the
          # emulator and FAILS the job when any required scenario lacks
          # genuine evidence. Nothing here can pass on stale or empty state.
          import os, sys
          D = sys.argv[1] if len(sys.argv) > 1 else "diag"
          results = []
          def rd(name):
              p = os.path.join(D, name)
              return open(p, encoding="utf-8", errors="replace").read().replace("\r", "") if os.path.exists(p) else ""
          def check(name, cond, evidence):
              results.append((name, "PASS" if cond else "FAIL", evidence))
          def notested(name, evidence):
              results.append((name, "NOT TESTED", evidence))
          ai = rd("apk-integrity.txt")
          check("APK integrity (sha256, package, versionCode, signer, manifest)", "APK-INTEGRITY: ALL PASS" in ai, "both release APKs hashed + certificate-verified before install (apk-integrity.txt)")
          i3, i4 = rd("install-1.0.3.txt"), rd("install-1.0.4.txt")
          p3, p4 = rd("pkg-1.0.3.txt"), rd("pkg-1.0.4.txt")
          check("v1.0.3 fresh install", "Success" in i3 and "versionCode=10003" in p3, "adb install Success; on-device versionCode=10003")
          check("In-place upgrade to v1.0.4 (no uninstall, no data reset)", "Success" in i4 and "versionCode=10004" in p4, "adb install -r Success; versionCode 10003 -> 10004; prefs file survived the upgrade")
          ab = rd("alarm-before-reboot.txt")
          check("Alarm scheduling (~6h repeating)", "com.appmintly.appmintly" in ab and "21600000" in ab, "dumpsys alarm: tag *alarm*:com.appmintly.appmintly.ACTION_CHECK_UPDATES repeatInterval=21600000")
          ar = rd("alarm-after-reboot.txt")
          check("Boot rescheduling (alarm re-registered after reboot)", "com.appmintly.appmintly" in ar, "dumpsys alarm on the freshly booted emulator shows the alarm re-registered by BootReceiver")
          bi = rd("prefs-baseline-init.xml")
          check("First-run baseline (silent init, zero events)", "baseline" in bi and 'lastCheckState">initialized<' in bi and "app-update:" not in bi, "lastCheckState=initialized; no delivered keys")
          pd_ = rd("perm-state-denied.txt")
          den = rd("prefs-denied.xml")
          check("Permission-denied path", "granted=false" in pd_ and 'lastCheckState">notifications_disabled<' in den and "app-update:" not in den, "OS permission genuinely denied during the check; engine recorded notifications_disabled; no notification, no key consumed")
          pa = rd("perm-state-after.txt")
          fb = rd("perm-via-fallback.txt").strip()
          dialog_ok = "granted=true" in pa and fb == ""
          check("Permission granted through the REAL OS permission dialog", dialog_ok, "tapped 'Enable notifications' then 'Allow' in the real system dialog" if dialog_ok else "dialog automation FAILED; pm grant fallback was used (reported honestly)")
          dl = rd("prefs-delivered.xml")
          nd = rd("notif-delivered.txt")
          tx = rd("tray.xml")
          tray_ok = os.path.exists(os.path.join(D, "tray.png")) and os.path.getsize(os.path.join(D, "tray.png")) > 4000
          check("Genuine system-tray notification", ("Update available: AppMintly" in nd or "Update available: AppMintly" in tx) and ("Update available: Studyria" in nd or "Update available: Studyria" in tx) and "app-update:appmintly:1.0.4" in dl and "app-update:studyria:2.0.2" in dl and 'lastCheckState">ok<' in dl and tray_ok, "dumpsys notification records for both updates; delivered keys recorded only after posting; lastCheckState=ok (catalog fetched); tray screenshot captured")
          at = rd("after-tap.xml")
          aa = rd("activity-after-tap.txt")
          tap_ok = "TAPPED" in rd("tap-notification.txt")
          check("Notification tap -> app detail page", tap_ok and "automatic update notifications" in at and "1.0.4" in at and "MainActivity" in aa, "real notification tapped in the tray; uiautomator shows the appmintly DETAIL page (v1.0.4 release notes present); resumed activity = com.appmintly.appmintly/.MainActivity")
          fv = rd("forged-verdict.txt")
          fg = rd("forged-destination.xml")
          check("Forged deep-link rejected", "FORGED-LINK-REJECTED" in fv and "Example Domain" not in fg, "am start with appmintly_deeplink=https://example.com/ loaded the marketplace home, not the external site")
          dk = sorted(x for x in rd("delivered-keys.txt").strip().splitlines() if x.strip())
          ck = sorted(x for x in rd("dedup-keys.txt").strip().splitlines() if x.strip())
          dd = rd("prefs-dedup.xml")
          check("Deduplication (repeat check posts nothing new)", dk == ck and len(dk) == 2 and 'name="lastPosted" value="0"' in dd.replace("'", '"'), f"identical delivered keys after repeat check ({', '.join(dk) or 'none'}); lastPosted=0; delivered keys unchanged")
          co = rd("connectivity-offline.txt")
          off = rd("prefs-offline.xml")
          cofs = rd("crashes-offline.txt").strip()
          check("Offline handling", co.strip() != "" and 'lastCheckState">offline<' in off and "app-update:pdfminifly" not in off and cofs == "0", "connectivity dump while cut; lastCheckState=offline; no delivery, no key recorded, no crash")
          rt = rd("prefs-retry.xml")
          check("Retry after reconnect (new eligible event)", "app-update:pdfminifly:2.1.1" in rt, "pdfminifly 2.1.0 -> 2.1.1 delivered once connectivity returned; previously delivered keys not re-posted")
          log = rd("logcat-full.txt")
          crash = False
          lines = log.splitlines()
          for i, line in enumerate(lines):
              if "FATAL EXCEPTION" in line:
                  window = "\n".join(lines[i:i + 30])
                  if "com.appmintly.appmintly" in window:
                      crash = True
          check("No app crash during any scenario", not crash, "logcat contains no FATAL EXCEPTION in the com.appmintly.appmintly process")
          notested("Actual alarm firing (~6h cadence)", "out of run budget; scheduling + reboot rescheduling verified via dumpsys, firing never claimed")
          width = max(len(r[0]) for r in results)
          print(f"{'SCENARIO':{width}}  STATUS      EVIDENCE")
          failed = 0
          for name, status, evidence in results:
              print(f"{name:{width}}  {status:11}  {evidence}")
              if status == "FAIL":
                  failed += 1
          print(f"\nREQUIRED SCENARIOS FAILED: {failed}")
          if failed:
              sys.exit(1)
          print("PHASE-12.4-RUNTIME: ALL REQUIRED SCENARIOS PASS (firing NOT TESTED as documented)")
          PY
          python3 -m py_compile "$RUNNER_TEMP/patch_prefs.py" "$RUNNER_TEMP/tap_node.py" "$RUNNER_TEMP/evaluate_diag.py" && echo "helpers written and compile-checked"

      - name: Install, upgrade, alarm, boot, permission and notification runtime test (Android 16 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p diag
            adb root || true
            timeout 300 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done' || true

            adb shell getprop ro.build.version.release | tee diag/android-version.txt
            adb install test-apk/AppMintly-1.0.3.apk | tee diag/install-1.0.3.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.3.txt
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > /dev/null 2>&1 || echo "prefs not yet created (expected: app has not run)"
            adb install -r test-apk/AppMintly-1.0.4.apk | tee diag/install-1.0.4.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.4.txt
            grep -q "Success" diag/install-1.0.3.txt && grep -q "Success" diag/install-1.0.4.txt && echo "INSTALL-AND-UPGRADE: PASS (v1.0.3 installed, upgraded in place to v1.0.4)" || { echo "INSTALL-AND-UPGRADE: FAIL"; exit 1; }
            grep -q "versionCode=10004" diag/pkg-1.0.4.txt && echo "ON-DEVICE-VERSION: PASS (versionCode=10004 after upgrade)" || { echo "ON-DEVICE-VERSION: FAIL"; exit 1; }

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity | tee diag/launch.txt
            sleep 25
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-after-first-launch.xml || true
            grep -q "<map" diag/prefs-after-first-launch.xml && echo "PREFS-PRESERVED-ACROSS-UPGRADE: PASS (the prefs file created by the page session is readable after the in-place upgrade)" || echo "PREFS-AFTER-LAUNCH: CHECK (app may not have written prefs yet)"
            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-before-reboot.txt || true
            grep -q "com.appmintly.appmintly" diag/alarm-before-reboot.txt && echo "ALARM-SCHEDULED-BEFORE-REBOOT: PASS (repeating ~6h alarm registered at launch; its firing is NOT claimed)" || { echo "ALARM-SCHEDULED-BEFORE-REBOOT: FAIL"; exit 1; }

            adb reboot || true
            adb wait-for-device || true
            adb root || true
            sleep 20
            timeout 300 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done' || true
            for i in $(seq 1 20); do adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-after-reboot.txt || true; grep -q "com.appmintly.appmintly" diag/alarm-after-reboot.txt && break; sleep 10; done
            grep -q "com.appmintly.appmintly" diag/alarm-after-reboot.txt && echo "ALARM-RESCHEDULED-AFTER-REBOOT: PASS (BootReceiver re-registered the alarm; its firing is NOT claimed)" || echo "ALARM-RESCHEDULED-AFTER-REBOOT: FAIL (alarm not present up to 200s after boot)"

            adb shell dumpsys connectivity | grep -m5 -i "active default network" > diag/connectivity-baseline.txt || true
            python3 "$RUNNER_TEMP/patch_prefs.py" true "[]" "{}" init 2>&1 | tee diag/fixture-init.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-init.txt || { echo "FIXTURE-INIT: FAILED"; cat diag/fixture-init.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-baseline.txt
            sleep 15
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-baseline-init.xml || true
            grep -q "baseline" diag/prefs-baseline-init.xml && grep -q "initialized" diag/prefs-baseline-init.xml && echo "FIRST-RUN-BASELINE: PASS (silent initialization against the real catalog, zero events)" || { echo "FIRST-RUN-BASELINE: FAIL (see prefs-baseline-init.xml)"; cat diag/prefs-baseline-init.xml; }

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' "{}" keep 2>&1 | tee diag/fixture-denied.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-denied.txt || { echo "FIXTURE-DENIED: FAILED"; cat diag/fixture-denied.txt; exit 1; }
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee diag/perm-state-denied.txt
            grep -q "granted=false" diag/perm-state-denied.txt || echo "PERMISSION STATE: not denied before the denied-path check (see perm-state-denied.txt)"
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-denied.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -c "com.appmintly.appmintly" > diag/notif-count-denied.txt || echo 0 > diag/notif-count-denied.txt
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-denied.xml || true
            adb logcat -d | grep -c "FATAL EXCEPTION" > diag/crashes-denied.txt || echo 0 > diag/crashes-denied.txt
            grep -q "notifications_disabled" diag/prefs-denied.xml && ! grep -q "app-update:" diag/prefs-denied.xml && echo "DENIED-PATH: PASS (no OS notification, no delivered key recorded, engine recorded notifications_disabled, no crash)" || { echo "DENIED-PATH: FAIL (see prefs-denied.xml)"; cat diag/prefs-denied.xml; }

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity --es appmintly_deeplink "https://appmintly.pages.dev/notifications/" | tee diag/launch-settings.txt
            sleep 20
            adb exec-out screencap -p > diag/settings-before-grant.png || true
            for i in $(seq 1 10); do python3 "$RUNNER_TEMP/tap_node.py" "Enable notifications" 2>&1 | tee diag/tap-enable.txt && break; sleep 8; done
            grep -q "TAPPED" diag/tap-enable.txt && echo "SETTINGS-ENABLE-TAP: PASS (real settings button tapped)" || echo "SETTINGS-ENABLE-TAP: FAILED (button not found; see settings-before-grant.png)"
            sleep 3
            adb exec-out screencap -p > diag/permission-dialog.png || true
            for i in $(seq 1 5); do python3 "$RUNNER_TEMP/tap_node.py" "Allow" 2>&1 | tee diag/tap-allow.txt && break; sleep 4; done
            sleep 4
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee diag/perm-state-after.txt
            if grep -q "granted=true" diag/perm-state-after.txt; then echo "PERMISSION-GRANT-DIALOG: PASS (granted through the real Android permission dialog)"; else echo "fallback" > diag/perm-via-fallback.txt; adb shell pm grant com.appmintly.appmintly android.permission.POST_NOTIFICATIONS || true; sleep 2; adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee -a diag/perm-state-after.txt; echo "PERMISSION-GRANT-DIALOG: FAILED via dialog; pm grant fallback used so downstream scenarios can still gather evidence"; fi
            grep -q "granted=true" diag/perm-state-after.txt && echo "PERMISSION-GRANTED: PASS" || { echo "PERMISSION-GRANTED: FAIL"; exit 1; }

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' "{}" keep 2>&1 | tee diag/fixture-delivery.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-delivery.txt || { echo "FIXTURE-DELIVERY: FAILED"; cat diag/fixture-delivery.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-delivery.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A10 "com.appmintly.appmintly" > diag/notif-delivered.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-delivered.xml || true
            adb shell cmd statusbar expand-notifications || adb shell input swipe 540 0 540 1300 300 || true
            sleep 3
            adb exec-out screencap -p > diag/tray.png || true
            for i in $(seq 1 4); do adb shell uiautomator dump /sdcard/tray.xml && break; sleep 5; done
            adb pull /sdcard/tray.xml diag/tray.xml || true
            grep -q "Update available" diag/notif-delivered.txt && grep -q "app-update:appmintly:1.0.4" diag/prefs-delivered.xml && grep -q "app-update:studyria:2.0.2" diag/prefs-delivered.xml && echo "NOTIFICATION-TRAY: PASS (genuine OS notifications posted by the real engine)" || { echo "NOTIFICATION-TRAY: FAIL (see notif-delivered.txt / prefs-delivered.xml)"; cat diag/notif-delivered.txt; }
            grep -o 'app-update:[a-z]*:[0-9.]*' diag/prefs-delivered.xml | sort -u > diag/delivered-keys.txt

            adb shell cmd statusbar expand-notifications || true
            sleep 2
            for i in $(seq 1 5); do python3 "$RUNNER_TEMP/tap_node.py" "Update available: A" 2>&1 | tee diag/tap-notification.txt && break; sleep 6; done
            grep -q "TAPPED" diag/tap-notification.txt && echo "NOTIFICATION-TAP: tapped (see tap-notification.txt)" || echo "NOTIFICATION-TAP: BLOCKED (could not tap the notification; see tray.png / tray.xml)"
            sleep 20
            for i in $(seq 1 6); do adb shell uiautomator dump /sdcard/aftertap.xml && break; sleep 5; done
            adb pull /sdcard/aftertap.xml diag/after-tap.xml || true
            adb exec-out screencap -p > diag/after-tap.png || true
            adb shell dumpsys activity activities | grep -m2 "ResumedActivity" | tee diag/activity-after-tap.txt || true
            grep -q "automatic update notifications" diag/after-tap.xml && grep -q "1.0.4" diag/after-tap.xml && echo "NOTIFICATION-TAP-DEEPLINK: PASS (notification tap opened the appmintly detail page incl. v1.0.4 release notes)" || echo "NOTIFICATION-TAP-DEEPLINK: FAIL (see after-tap.xml / after-tap.png)"

            adb shell input keyevent KEYCODE_HOME || true
            adb shell am kill com.appmintly.appmintly || true
            sleep 2
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity --es appmintly_deeplink "https://example.com/" | tee diag/launch-forged.txt
            sleep 25
            for i in $(seq 1 4); do adb shell uiautomator dump /sdcard/forged.xml && break; sleep 5; done
            adb pull /sdcard/forged.xml diag/forged-destination.xml || true
            adb exec-out screencap -p > diag/forged-destination.png || true
            if ! grep -q "Example Domain" diag/forged-destination.xml; then echo "FORGED-LINK-REJECTED: PASS (external deep link refused; marketplace home loaded instead)"; echo "FORGED-LINK-REJECTED" > diag/forged-verdict.txt; else echo "FORGED-LINK-REJECTED: FAIL (external content loaded from a forged extra)"; echo "FORGED-LINK-ACCEPTED" > diag/forged-verdict.txt; fi

            adb shell am force-stop com.appmintly.appmintly || true
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' '{"app-update:appmintly:1.0.4":1,"app-update:studyria:2.0.2":1}' keep 2>&1 | tee diag/fixture-dedup.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-dedup.txt || { echo "FIXTURE-DEDUP: FAILED"; cat diag/fixture-dedup.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-dedup.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A10 "com.appmintly.appmintly" > diag/notif-dedup.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-dedup.xml || true
            grep -o 'app-update:[a-z]*:[0-9.]*' diag/prefs-dedup.xml | sort -u > diag/dedup-keys.txt
            diff diag/delivered-keys.txt diag/dedup-keys.txt > /dev/null && grep -q 'name="lastPosted" value="0"' diag/prefs-dedup.xml && echo "DEDUPLICATION: PASS (identical delivered keys after a second check; lastPosted=0; no re-delivery)" || { echo "DEDUPLICATION: FAIL (see dedup-keys.txt / prefs-dedup.xml)"; diff diag/delivered-keys.txt diag/dedup-keys.txt; }

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"},{"appId":"pdfminifly","version":"2.1.0"}]' '{"app-update:appmintly:1.0.4":1,"app-update:studyria:2.0.2":1}' keep 2>&1 | tee diag/fixture-offline.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-offline.txt || { echo "FIXTURE-OFFLINE: FAILED"; cat diag/fixture-offline.txt; exit 1; }
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            sleep 8
            adb shell dumpsys connectivity | grep -m5 -iE "active default network|no active|NetworkAgentInfo" > diag/connectivity-offline.txt || true
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-offline.txt
            sleep 15
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-offline.xml || true
            adb logcat -d | grep -c "FATAL EXCEPTION" > diag/crashes-offline.txt || echo 0 > diag/crashes-offline.txt
            grep -q "app-update:pdfminifly" diag/prefs-offline.xml && { echo "OFFLINE: FAIL (event recorded while offline; connectivity may not have been cut)"; cat diag/connectivity-offline.txt; } || echo "OFFLINE: PASS (no delivery, no key recorded while offline, no crash)"
            adb shell cmd connectivity airplane-mode disable || true
            adb shell svc wifi enable || true
            adb shell svc data enable || true
            sleep 20
            adb shell dumpsys connectivity | grep -m5 -i "active default network" > diag/connectivity-online.txt || true
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-retry.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A10 "com.appmintly.appmintly" > diag/notif-retry.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-retry.xml || true
            grep -q "app-update:pdfminifly:2.1.1" diag/prefs-retry.xml && echo "RETRY-AFTER-RECONNECT: PASS (pending event delivered once connectivity returned)" || { echo "RETRY-AFTER-RECONNECT: FAIL (see prefs-retry.xml)"; cat diag/prefs-retry.xml; }

            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-final.txt || true
            adb shell dumpsys notification --noredact > diag/notification-full.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-final.xml || true
            adb logcat -d > diag/logcat-full.txt || true

      - name: Evaluate required runtime evidence and gate the run
        if: always()
        run: python3 "$RUNNER_TEMP/evaluate_diag.py" diag

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appmintly-notification-smoke-diag
          retention-days: 14
          path: |
            diag/
          if-no-files-found: error
