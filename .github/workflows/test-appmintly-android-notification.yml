# AppMintly Phase 12.4 — isolated Android notification runtime smoke test.
#
# MANUALLY TRIGGERED ONLY (workflow_dispatch). Touches nothing in production:
# it installs the already-released AppMintly APKs (v1.0.3 -> v1.0.4 upgrade),
# reads the production catalog read-only, and confines ALL test state to a
# disposable emulator's local SharedPreferences (the isolated fixture).
# No APK build, no signing, no catalog writes, no push provider, no real users.
#
# Honest-scope notes encoded in the test:
#  - The ~6h alarm is verified as SCHEDULED (dumpsys) and RESCHEDULED after
#    reboot. Its actual firing is NEVER claimed — checks are forced through
#    the same ACTION_CHECK_UPDATES broadcast the alarm uses.
#  - The fixture sets tracked apps to genuinely older, previously-real
#    versions (appmintly 1.0.3, studyria 2.0.1, pdfminifly 2.1.0) so the
#    REAL native engine, REAL OS notification path and REAL catalog produce
#    genuine "Update available" notifications. No test records are inserted
#    into the production catalog.
name: Test AppMintly Android notification runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  notification-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download released AppMintly APKs (authoritative release assets, not rebuilt)
        run: |
          mkdir -p test-apk diag
          curl -fsSL -o test-apk/AppMintly-1.0.3.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.3/AppMintly-1.0.3.apk"
          curl -fsSL -o test-apk/AppMintly-1.0.4.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.4/AppMintly-1.0.4.apk"

      - name: Verify APK integrity (sha256, package, versionCode, signing certificate) BEFORE installation
        run: |
          pip install --quiet androguard
          EXPECTED_103="23ef68b76f109d9a7af68a49f094d5dc3a52bf02a2157ceb4de30ca2b7dfac1e"
          EXPECTED_104="eeca15eef78553e997d2b645fc409058e6c56ec05c9436c54ca3647659fd051b"
          EXPECTED_CERT="dbafc6d389516069518826d1e1320cebcf7970eec9249d749de699b730f61368"
          for f in test-apk/AppMintly-1.0.3.apk test-apk/AppMintly-1.0.4.apk; do
            sha256sum "$f"
          done
          python3 - "$EXPECTED_103" "$EXPECTED_104" "$EXPECTED_CERT" <<'PY'
          import hashlib, sys
          from androguard.core.apk import APK
          import logging; logging.disable(logging.CRITICAL)
          exp103, exp104, expcert = sys.argv[1:4]
          for f, exp in [("test-apk/AppMintly-1.0.3.apk", exp103), ("test-apk/AppMintly-1.0.4.apk", exp104)]:
              a = APK(f)
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              assert h == exp, f"{f}: sha256 mismatch {h}"
              assert a.get_package() == "com.appmintly.appmintly", a.get_package()
              certs = a.get_certificates_der_v2() or a.get_certificates_der()
              cert = hashlib.sha256(certs[0]).hexdigest()
              assert cert == expcert, f"{f}: signer cert mismatch {cert}"
              print(f"VERIFIED {f}: sha256={h}")
              print(f"  package={a.get_package()} versionCode={a.get_androidversion_code()} versionName={a.get_androidversion_name()}")
              print(f"  signerCert sha256={cert}")
          exp_vc = {"test-apk/AppMintly-1.0.3.apk": "10003", "test-apk/AppMintly-1.0.4.apk": "10004"}
          for f, vc in exp_vc.items():
              assert APK(f).get_androidversion_code() == vc, f
          print("APK-INTEGRITY: ALL PASS (hash, package, versionCode, signing cert)")
          PY

      - name: Write emulator-side helper scripts (prefs fixture patcher, UI node tapper)
        run: |
          cat > "$RUNNER_TEMP/patch_prefs.py" <<'PY'
          # Patch the app's LOCAL SharedPreferences inside the disposable emulator
          # (the isolated fixture). Only touches emulator state, never production.
          import subprocess, sys, xml.etree.ElementTree as ET, tempfile, os
          APK = "com.appmintly.appmintly"
          PREFS = "/data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml"
          def sh(*args):
              return subprocess.run(["adb", "shell", *args], capture_output=True, text=True).stdout
          def adb(*args):
              r = subprocess.run(["adb", *args], capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f"adb {args} failed: {r.stderr}")
              return r.stdout
          master, tracked_json, delivered_json = sys.argv[1], sys.argv[2], sys.argv[3]
          sh("am", "force-stop", APK)
          sleep_cmd = None
          uid = None
          for line in sh("dumpsys", "package", APK).splitlines():
              if "userId=" in line:
                  uid = line.split("userId=")[1].strip().split()[0].rstrip(")").strip(); break
          assert uid, "could not resolve app uid"
          tmp = tempfile.mktemp(suffix=".xml")
          adb("pull", PREFS, tmp)
          text = open(tmp, encoding="utf-8").read()
          if "<map" not in text:
              raise SystemExit("prefs file missing; app never ran")
          root = ET.fromstring(text)
          def set_string(name, value):
              el = root.find(f"./string[@name='{name}']")
              if el is None:
                  el = ET.SubElement(root, "string", {"name": name})
              el.text = value
          def set_boolean(name, value):
              el = root.find(f"./boolean[@name='{name}']")
              if el is None:
                  el = ET.SubElement(root, "boolean", {"name": name})
              el.set("value", value)
          set_boolean("master", master)
          set_string("tracked", tracked_json)
          set_string("delivered", delivered_json)
          out_text = "<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n" + ET.tostring(root, encoding="unicode")
          out = tempfile.mktemp(suffix=".xml")
          open(out, "w", encoding="utf-8").write(out_text)
          tmp_push = "/data/local/tmp/fixture_prefs.xml"
          adb("push", out, tmp_push)
          sh(f"cp {tmp_push} {PREFS} && chown {uid}:{uid} {PREFS} && chmod 660 {PREFS} && rm {tmp_push}")
          print(f"FIXTURE-APPLIED master={master} tracked={tracked_json} delivered={delivered_json}")
          PY
          cat > "$RUNNER_TEMP/tap_node.py" <<'PY'
          # Find a UI node by text substring in a uiautomator dump and tap its center.
          import subprocess, sys, re, tempfile
          needle = sys.argv[1]
          subprocess.run(["adb", "shell", "rm", "-f", "/sdcard/tapdump.xml"], capture_output=True)
          subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/tapdump.xml"], capture_output=True)
          tmp = tempfile.mktemp(suffix=".xml")
          subprocess.run(["adb", "pull", "/sdcard/tapdump.xml", tmp], capture_output=True)
          xml = open(tmp, encoding="utf-8", errors="replace").read()
          best = None
          for node in re.finditer(r'<node[^>]*?/?>', xml):
              tag = node.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              dm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              if not (tm and dm):
                  continue
              if needle in tm.group(1):
                  x = (int(dm.group(1)) + int(dm.group(3))) // 2
                  y = (int(dm.group(2)) + int(dm.group(4))) // 2
                  if int(dm.group(3)) > int(dm.group(1)) and int(dm.group(4)) > int(dm.group(2)):
                      best = (x, y, tm.group(1))
                      break
          if not best:
              print(f"NODE-NOT-FOUND: {needle}")
              sys.exit(1)
          x, y, txt = best
          subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], capture_output=True)
          print(f"TAPPED: '{txt}' at {x},{y}")
          PY
          echo "helpers written"

      - name: Install, upgrade, alarm, boot, permission and notification runtime test (Android 16 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -x
            cd "$GITHUB_WORKSPACE"
            mkdir -p diag
            adb root
            adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'

            # ---------- Phase A: install v1.0.3, upgrade in place to v1.0.4 ----------
            adb install test-apk/AppMintly-1.0.3.apk | tee diag/install-1.0.3.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.3.txt
            adb install -r test-apk/AppMintly-1.0.4.apk | tee diag/install-1.0.4.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.4.txt
            grep -q "Success" diag/install-1.0.3.txt && grep -q "Success" diag/install-1.0.4.txt && echo "INSTALL-UPGRADE: PASS"

            # ---------- Phase B: launch once (registers the ~6h alarm), verify schedule ----------
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity | tee diag/launch.txt
            sleep 25
            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-before-reboot.txt || true
            grep -q "com.appmintly.appmintly" diag/alarm-before-reboot.txt \
              && echo "ALARM-SCHEDULED: repeating ~6h alarm entry present (NOT claiming it fired)" \
              || echo "ALARM-SCHEDULED: NOT FOUND"

            # ---------- Phase C: reboot -> BootReceiver must reschedule the alarm ----------
            adb reboot
            adb wait-for-device
            adb root
            sleep 25
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            sleep 10
            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-after-reboot.txt || true
            grep -q "com.appmintly.appmintly" diag/alarm-after-reboot.txt \
              && echo "ALARM-RESCHEDULED-AFTER-REBOOT: PASS (scheduled, firing not claimed)" \
              || echo "ALARM-RESCHEDULED-AFTER-REBOOT: FAIL"

            # ---------- Phase D: enable master + empty fixture -> first silent check
            #           initializes the real baseline from the production catalog ----------
            adb shell am force-stop com.appmintly.appmintly
            python3 "$RUNNER_TEMP/patch_prefs.py" true "[]" "{}" 2>&1 | tee diag/fixture-init.txt
            adb shell am broadcast -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-baseline.txt
            sleep 15
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-baseline-init.xml
            grep -q '"baseline"' diag/prefs-baseline-init.xml && grep -q 'initialized' diag/prefs-baseline-init.xml \
              && echo "FIRST-RUN-BASELINE: PASS (silent init, no events)" \
              || echo "FIRST-RUN-BASELINE: FAIL"

            # ---------- Phase E: denied-permission path. Fixture: apps tracked at
            #           genuinely older versions. Permission is still denied (fresh
            #           install default on Android 13+). No OS notification may be
            #           posted and no delivered key may be recorded. ----------
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' "{}" 2>&1 | tee diag/fixture-denied.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee diag/perm-state-denied.txt
            adb shell am broadcast -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-denied.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -c "com.appmintly.appmintly" > diag/notif-count-denied.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-denied.xml
            adb logcat -d | grep -c "FATAL EXCEPTION" > diag/crashes-denied.txt || true
            DENIED_NOTIF_COUNT=$(cat diag/notif-count-denied.txt)
            if [ "$DENIED_NOTIF_COUNT" = "0" ] && ! grep -q '"delivered">{}' diag/prefs-denied.xml 2>/dev/null && ! grep -q 'app-update' diag/prefs-denied.xml; then
              echo "DENIED-PATH: PASS (no OS notification, no delivered key recorded, no crash)"
            else
              echo "DENIED-PATH: CHECK MANUALLY (notif count=$DENIED_NOTIF_COUNT)"
            fi

            # ---------- Phase F: grant permission through the ACTUAL Android
            #           permission dialog (real user flow in the marketplace UI) ----------
            adb shell am force-stop com.appmintly.appmintly
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity --es appmintly_deeplink "https://appmintly.pages.dev/notifications/" | tee diag/launch-settings.txt
            sleep 25
            adb exec-out screencap -p > diag/settings-before-grant.png || true
            python3 "$RUNNER_TEMP/tap_node.py" "Enable notifications" 2>&1 | tee diag/tap-enable.txt
            sleep 3
            adb exec-out screencap -p > diag/permission-dialog.png || true
            python3 "$RUNNER_TEMP/tap_node.py" "Allow" 2>&1 | tee diag/tap-allow.txt
            sleep 4
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee diag/perm-state-after.txt
            if grep -q "granted=true" diag/perm-state-after.txt; then
              echo "PERMISSION-GRANT-DIALOG: PASS (granted through the real system dialog)"
            else
              echo "PERMISSION-GRANT-DIALOG: UI automation failed; falling back to pm grant (still the OS permission mechanism)"
              adb shell pm grant com.appmintly.appmintly android.permission.POST_NOTIFICATIONS
              sleep 2
              adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee -a diag/perm-state-after.txt
              grep -q "granted=true" diag/perm-state-after.txt && echo "PERMISSION-GRANT: PASS (via pm grant fallback)" || echo "PERMISSION-GRANT: FAIL"
            fi
            adb shell am force-stop com.appmintly.appmintly

            # ---------- Phase G: re-apply fixture (WebView load syncs web state to
            #           native, so restore tracked/master), then trigger the REAL
            #           update-check path and capture genuine tray evidence ----------
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' "{}" 2>&1 | tee diag/fixture-delivery.txt
            adb shell am broadcast -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-delivery.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A10 "com.appmintly.appmintly" > diag/notif-delivered.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-delivered.xml
            adb shell cmd statusbar expand-notifications || adb shell input swipe 540 0 540 1300 300 || true
            sleep 3
            adb exec-out screencap -p > diag/tray.png || true
            adb shell uiautomator dump /sdcard/tray.xml || true
            adb pull /sdcard/tray.xml diag/tray.xml || true
            grep -q "Update available" diag/notif-delivered.txt && echo "NOTIFICATION-TRAY: PASS (genuine OS notification posted)"
            grep -o 'app-update:[a-z]*:[0-9.]*' diag/prefs-delivered.xml | sort -u | tee diag/delivered-keys.txt
            grep -q "app-update:appmintly:1.0.4" diag/prefs-delivered.xml && grep -q "app-update:studyria:2.0.2" diag/prefs-delivered.xml \
              && echo "DELIVERED-KEYS-RECORDED: PASS (only after successful delivery)"

            # ---------- Phase H: tap the notification -> MainActivity deep link
            #           must open the intended app detail page ----------
            python3 "$RUNNER_TEMP/tap_node.py" "Update available: AppMintly" 2>&1 | tee diag/tap-notification.txt
            sleep 10
            adb shell uiautomator dump /sdcard/aftertap.xml || true
            adb pull /sdcard/aftertap.xml diag/after-tap.xml || true
            adb exec-out screencap -p > diag/after-tap.png || true
            adb shell dumpsys activity activities | grep -m2 "mResumedActivity\|topResumedActivity" | tee diag/activity-after-tap.txt || true
            grep -q "AppMintly" diag/after-tap.xml && grep -q "1.0.4" diag/after-tap.xml \
              && echo "NOTIFICATION-TAP-DEEPLINK: PASS (app detail destination opened)" \
              || echo "NOTIFICATION-TAP-DEEPLINK: VERIFY MANUALLY (see after-tap.xml/png)"

            # ---------- Phase I: deduplication. Second check must not re-deliver. ----------
            adb shell am force-stop com.appmintly.appmintly || true
            adb shell am broadcast -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-dedup.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A10 "com.appmintly.appmintly" > diag/notif-dedup.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-dedup.xml
            BEFORE=$(grep -c "when=" diag/notif-delivered.txt || true)
            AFTER=$(grep -c "when=" diag/notif-dedup.txt || true)
            echo "notification post records before=$BEFORE after=$AFTER" | tee diag/dedup-summary.txt
            grep -o 'app-update:[a-z]*:[0-9.]*' diag/prefs-dedup.xml | sort -u | tee diag/dedup-keys.txt
            diff diag/delivered-keys.txt diag/dedup-keys.txt \
              && echo "DEDUPLICATION: PASS (no new delivered keys, no re-post)" \
              || echo "DEDUPLICATION: FAIL or verify manually"

            # ---------- Phase J: offline handling + retry after connectivity restored ----------
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"},{"appId":"pdfminifly","version":"2.1.0"}]' '{"app-update:appmintly:1.0.4":1,"app-update:studyria:2.0.2":1}' 2>&1 | tee diag/fixture-offline.txt
            adb shell svc wifi disable
            adb shell svc data disable
            sleep 5
            adb shell am broadcast -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-offline.txt
            sleep 15
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-offline.xml
            adb logcat -d | grep -c "FATAL EXCEPTION" > diag/crashes-offline.txt || true
            grep -q "app-update:pdfminifly" diag/prefs-offline.xml \
              && echo "OFFLINE: FAIL (event recorded while offline)" \
              || echo "OFFLINE: PASS (no delivery, no key recorded, no crash while offline)"
            adb shell svc wifi enable
            adb shell svc data enable
            sleep 20
            adb shell am broadcast -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-retry.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A10 "com.appmintly.appmintly" > diag/notif-retry.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-retry.xml
            grep -q "app-update:pdfminifly:2.1.1" diag/prefs-retry.xml \
              && echo "RETRY-AFTER-RECONNECT: PASS (pending event delivered after connectivity restored)" \
              || echo "RETRY-AFTER-RECONNECT: FAIL"

            # ---------- Final: alarm still scheduled + full diagnostics ----------
            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-final.txt || true
            adb shell dumpsys notification --noredact > diag/notification-full.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-final.xml || true
            adb logcat -d > diag/logcat-full.txt || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: appmintly-notification-smoke-diag
          path: |
            diag/
          if-no-files-found: error
