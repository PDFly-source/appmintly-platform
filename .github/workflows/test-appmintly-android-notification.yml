# AppMintly Phase 12.4 — isolated Android notification runtime test.
#
# MANUALLY TRIGGERED ONLY (workflow_dispatch). Touches nothing in production:
# it installs the already-released AppMintly APKs (v1.0.3 -> v1.0.4 -> v1.0.5 in-place
# upgrade), reads the production catalog read-only, and confines ALL test
# state to a disposable emulator's local SharedPreferences (the isolated
# fixture). No APK build, no signing, no catalog writes, no push provider,
# no real users.
#
# Honest-scope notes encoded in the test:
#  - The ~6h alarm is verified as SCHEDULED (dumpsys) and RESCHEDULED after
#    reboot. Its actual firing is NEVER claimed — checks are forced through
#    the same AlarmReceiver broadcast the alarm uses, and firing is reported
#    as NOT TESTED (out of run budget).
#  - KNOWN PRODUCT FINDING (documented by this run, NOT fixed here — app
#    source changes are out of Phase 12.4 scope): the APK WebView exposes no
#    window.Notification API, so the in-app /notifications page reports
#    "Unsupported" and never renders its "Enable notifications" button.
#    Therefore the runtime test grants POST_NOTIFICATIONS through the REAL
#    Android OS Settings UI (the genuine user-reachable mechanism) and
#    records the in-app page as evidence.
#  - The check engine exits at notifications_disabled BEFORE baseline init,
#    so the denied-path scenario runs first and baseline initialization is
#    verified after permission is granted.
#  - The runner executes this script line-by-line and ABORTS the whole step
#    on any line exiting non-zero: every soft line below ends in a
#    guaranteed-zero construct; only the hard gates exit 1.
name: Test AppMintly Android notification runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  static-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Notification engine unit tests
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-notification-engine.ts

      - name: PKD catalog data validation
        run: node scripts/test-pkd-data.mjs

      - name: Publisher statistics gate
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-publisher-stats.ts

      - name: WebView ownership gate
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-webview-ownership.ts https://appmintly.pages.dev/

      # Mirrors the production GitHub Pages build gate exactly (deploy.yml):
      # API routes are server-side publisher tooling excluded from the static
      # export; the catalog is shipped as static data.
      - name: Production static-export build check
        run: rm -rf app/api && NEXT_OUTPUT=export NEXT_PUBLIC_BASE_PATH=/appmintly-platform npm run build

  notification-smoke:
    runs-on: ubuntu-24.04
    needs: static-gates
    timeout-minutes: 75
    steps:
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform + build tools (in-test candidate build)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          echo "toolchain ready (platform-36, build-tools 36.0.0)"

      - name: Prepare candidate signing (authorized production identity; candidate is built only to be installed on this disposable emulator and is never uploaded or released)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-build"
          curl --fail --location --silent --show-error \
            'https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar' \
            -o "$RUNNER_TEMP/android-build/r8.jar"
          test -s "$RUNNER_TEMP/android-build/r8.jar"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-build/signing.keystore"
          test -s "$RUNNER_TEMP/android-build/signing.keystore"
          echo "ANDROID_JAR=/usr/local/lib/android/sdk/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "R8_JAR=$RUNNER_TEMP/android-build/r8.jar" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-build/signing.keystore" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Download released AppMintly APKs (authoritative release assets, not rebuilt)
        run: |
          mkdir -p test-apk diag
          curl -fsSL -w 'v1.0.3 HTTP %{http_code} %{size_download} bytes\n' -o test-apk/AppMintly-1.0.3.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.3/AppMintly-1.0.3.apk"
          curl -fsSL -w 'v1.0.4 HTTP %{http_code} %{size_download} bytes\n' -o test-apk/AppMintly-1.0.4.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.4/AppMintly-1.0.4.apk"
          curl -fsSL -w 'v1.0.5 HTTP %{http_code} %{size_download} bytes\n' -o test-apk/AppMintly-1.0.5.apk \
            "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.5/AppMintly-1.0.5.apk"

      - name: Verify APK integrity (sha256, package, versionCode, signing certificate) BEFORE installation
        run: |
          pip install --quiet androguard
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee diag/apk-integrity.txt
          import hashlib
          from androguard.core.apk import APK
          import logging
          logging.disable(logging.CRITICAL)
          # androguard 4.x logs through loguru, not logging — silence its
          # default sink so the evidence file stays readable.
          try:
              from loguru import logger as _loguru_logger
              _loguru_logger.remove()
          except Exception:
              pass
          EXPECTED = {
              "test-apk/AppMintly-1.0.3.apk": ("23ef68b76f109d9a7af68a49f094d5dc3a52bf02a2157ceb4de30ca2b7dfac1e", "10003", "1.0.3"),
              "test-apk/AppMintly-1.0.4.apk": ("eeca15eef78553e997d2b645fc409058e6c56ec05c9436c54ca3647659fd051b", "10004", "1.0.4"),
              "test-apk/AppMintly-1.0.5.apk": ("c08ae4662b51c57fe06f465a857fb34e4e1ec13a53b0568db8a561e4e5555312", "10005", "1.0.5"),
          }
          EXPECTED_CERT = "dbafc6d389516069518826d1e1320cebcf7970eec9249d749de699b730f61368"
          for f, (exp_hash, exp_vc, exp_vn) in EXPECTED.items():
              a = APK(f)
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              assert h == exp_hash, f"{f}: sha256 mismatch {h}"
              assert a.get_package() == "com.appmintly.appmintly", a.get_package()
              assert a.get_androidversion_code() == exp_vc, a.get_androidversion_code()
              assert a.get_androidversion_name() == exp_vn, a.get_androidversion_name()
              cert = hashlib.sha256((a.get_certificates_der_v2() or a.get_certificates_der())[0]).hexdigest()
              assert cert == EXPECTED_CERT, f"{f}: signer cert mismatch {cert}"
              print(f"VERIFIED {f}: sha256={h}")
              print(f"  package={a.get_package()} versionCode={exp_vc} versionName={exp_vn} targetSdk={a.get_target_sdk_version()}")
              print(f"  signerCert sha256={cert}")
          # v1.0.4 and v1.0.5 must carry the notification runtime declarations.
          for ver, apkfile in (("1.0.4", "test-apk/AppMintly-1.0.4.apk"), ("1.0.5", "test-apk/AppMintly-1.0.5.apk")):
              av = APK(apkfile)
              recv = [".AlarmReceiver", ".BootReceiver"]
              recvs = av.get_receivers()
              for r in recv:
                  assert any(r in rcvr for rcvr in recvs), f"v{ver} missing receiver {r}: {recvs}"
              perms = av.get_permissions()
              assert "android.permission.POST_NOTIFICATIONS" in perms, f"v{ver} missing POST_NOTIFICATIONS: {perms}"
              assert "android.permission.RECEIVE_BOOT_COMPLETED" in perms, f"v{ver} missing RECEIVE_BOOT_COMPLETED: {perms}"
              print(f"  v{ver} receivers={recvs}")
          print("APK-INTEGRITY: ALL PASS (hash, package, versionCode, signing certificate, receivers, permissions)")
          PY

      - name: Write helper scripts (fixture patcher, UI tapper, evidence evaluator)
        run: |
          cat > "$RUNNER_TEMP/patch_prefs.py" <<'PY'
          # Patch the app's LOCAL SharedPreferences inside the disposable
          # emulator (the isolated fixture). Ownership-preserving: writes via
          # `cat >` onto the app's own inode, so no uid lookup / chown is
          # needed. The app is backgrounded and killed with `am kill` — never
          # force-stop, which would cancel the app's alarms and put it in the
          # stopped state. Every patch is verified by reading the file back.
          import subprocess, sys, time, tempfile
          import xml.etree.ElementTree as ET
          APK = "com.appmintly.appmintly"
          PREFS = "/data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml"
          def adb(*args):
              r = subprocess.run(["adb", *args], capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f"adb {' '.join(args)} failed: {r.stderr}")
              return r.stdout
          def sh(cmd):
              return subprocess.run(["adb", "shell", cmd], capture_output=True, text=True).stdout
          master, tracked_json, delivered_json, mode = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          sh("input keyevent KEYCODE_WAKEUP")
          sh("input keyevent KEYCODE_HOME")
          time.sleep(2)
          sh(f"am kill {APK}")
          time.sleep(2)
          alive = sh(f"pidof {APK}").strip()
          if alive:
              raise SystemExit(f"app process still alive after am kill (pid {alive}); refusing to patch")
          tmp = tempfile.mktemp(suffix=".xml")
          adb("pull", PREFS, tmp)
          text = open(tmp, encoding="utf-8").read()
          if "<map" not in text:
              raise SystemExit("prefs file missing; app never ran")
          root = ET.fromstring(text)
          def set_string(name, value):
              el = root.find(f"./string[@name='{name}']")
              if el is None:
                  el = ET.SubElement(root, "string", {"name": name})
              el.text = value
          def set_boolean(name, value):
              el = root.find(f"./boolean[@name='{name}']")
              if el is None:
                  el = ET.SubElement(root, "boolean", {"name": name})
              el.set("value", value)
          set_boolean("master", master)
          set_boolean("updates", "true")
          set_boolean("newAndroid", "true")
          set_boolean("newWeb", "true")
          set_boolean("important", "true")
          set_boolean("security", "true")
          set_string("tracked", tracked_json)
          set_string("delivered", delivered_json)
          # Sentinel: every real check overwrites lastCheckState with its own
          # outcome, so a lingering "fixture-pending" in the evidence means a
          # check never ran and the gate fails loudly instead of passing on
          # stale state.
          set_string("lastCheckState", "fixture-pending")
          el = root.find("./long[@name='lastCheck']")
          if el is not None:
              root.remove(el)
          el = root.find("./int[@name='lastPosted']")
          if el is not None:
              root.remove(el)
          if mode == "init":
              el = root.find("./string[@name='baseline']")
              if el is not None:
                  root.remove(el)
          out = tempfile.mktemp(suffix=".xml")
          open(out, "w", encoding="utf-8").write("<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n" + ET.tostring(root, encoding="unicode"))
          adb("push", out, "/data/local/tmp/fixture_prefs.xml")
          sh(f"cat /data/local/tmp/fixture_prefs.xml > {PREFS}")
          sh("rm -f /data/local/tmp/fixture_prefs.xml")
          check = sh(f"cat {PREFS}").replace("\r", "")
          ok = (f'name="master" value="{master}"' in check.replace("'", '"')) and tracked_json in check and "fixture-pending" in check
          if not ok:
              raise SystemExit("fixture verification failed: prefs read-back mismatch")
          print(f"FIXTURE-APPLIED mode={mode} master={master} tracked={tracked_json} delivered={delivered_json}")
          PY
          cat > "$RUNNER_TEMP/tap_node.py" <<'PY'
          # Locate a node in a uiautomator dump and interact with it.
          #   text mode:   exact text/content-desc match first, then substring.
          #                The tap targets the nearest CLICKABLE ancestor's
          #                center (the notification card / button container),
          #                not the text node itself - title-node taps in the
          #                shade kept hitting the section header instead.
          #   switch mode: android.widget.Switch containing the needle
          #                (fallback: any Switch); taps the switch itself.
          #   swipe / swipe-r: horizontal dismiss gesture across the row.
          #   probe:       exit 0 if the needle is visible, 4 if not.
          # Optional 3rd argv: path to save the raw dump used.
          import subprocess, sys, tempfile, time
          import xml.etree.ElementTree as ET

          needle = sys.argv[1]
          mode = sys.argv[2] if len(sys.argv) > 2 else "text"
          save = sys.argv[3] if len(sys.argv) > 3 else None

          def sh(*args):
              try:
                  return subprocess.run(list(args), capture_output=True, text=True, timeout=90)
              except Exception:
                  return None

          def get_dump():
              sh("adb", "shell", "rm", "-f", "/sdcard/tapdump.xml")
              for _ in range(8):
                  r = sh("adb", "shell", "uiautomator", "dump", "/sdcard/tapdump.xml")
                  if r and "dumped" in (r.stdout + r.stderr).lower():
                      break
                  time.sleep(2)
              tmp = tempfile.NamedTemporaryFile(delete=False, suffix=".xml")
              sh("adb", "pull", "/sdcard/tapdump.xml", tmp.name)
              try:
                  return open(tmp.name, encoding="utf-8", errors="replace").read()
              except OSError:
                  return ""

          xml = get_dump()
          if save:
              try:
                  open(save, "w", encoding="utf-8").write(xml)
              except OSError:
                  pass

          try:
              root = ET.fromstring(xml)
          except ET.ParseError:
              print("TAP-NODE: empty/unparsable dump")
              sys.exit(3)

          parent = {c: p for p in root.iter() for c in p}
          first = root.find(".//node")
          screen_area = 1080 * 2400
          if first is not None:
              try:
                  fx1, fy1, fx2, fy2 = map(int, first.get("bounds", "[0,0][1080,2400]").replace("][", ",").strip("[]").split(","))
                  screen_area = max(1, (fx2 - fx1) * (fy2 - fy1))
              except ValueError:
                  pass

          def bounds_of(node):
              try:
                  return map(int, node.get("bounds", "[0,0][0,0]").replace("][", ",").strip("[]").split(","))
              except ValueError:
                  return (0, 0, 0, 0)

          scored = []
          for n in root.iter("node"):
              text = n.get("text", "")
              desc = n.get("content-desc", "")
              label = None
              exact = False
              if mode == "switch":
                  if n.get("class", "") == "android.widget.Switch":
                      for t in (text, desc):
                          if t and needle in t:
                              label, exact = t, True
                              break
                      if label is None:
                          label = desc or text or "Switch"
              else:
                  for t in (text, desc):
                      if t == needle:
                          label, exact = t, True
                          break
                      if t and needle in t:
                          label = t
                          break
              if label is None:
                  continue
              x1, y1, x2, y2 = bounds_of(n)
              scored.append(((0 if exact else 1, (y1 + y2) // 2), n, label, (x1, y1, x2, y2)))

          if not scored:
              print(f"TAP-NODE: needle not found: '{needle}'")
              sys.exit(4)

          scored.sort(key=lambda c: c[0])
          _, node, label, (x1, y1, x2, y2) = scored[0]

          if mode == "probe":
              print(f"FOUND: '{label}'")
              sys.exit(0)

          target = node
          if mode == "text":
              anc = node
              hops = 0
              while anc in parent and hops < 4:
                  anc = parent[anc]
                  hops += 1
                  if anc.get("clickable") == "true":
                      ax1, ay1, ax2, ay2 = bounds_of(anc)
                      if (ax2 - ax1) * (ay2 - ay1) < 0.25 * screen_area:
                          target = anc
                          x1, y1, x2, y2 = ax1, ay1, ax2, ay2
                      break

          x, y = (x1 + x2) // 2, (y1 + y2) // 2
          if mode in ("swipe", "swipe-r"):
              right = max(x2 - 60, x1 + 60)
              if mode == "swipe":
                  sh("adb", "shell", "input", "swipe", str(right), str(y), str(x1 + 60), str(y), "400")
              else:
                  sh("adb", "shell", "input", "swipe", str(x1 + 60), str(y), str(right), str(y), "400")
              print(f"SWIPED {mode}: '{label}' at y={y}")
          else:
              sh("adb", "shell", "input", "tap", str(x), str(y))
              src = "card" if target is not node else "node"
              print(f"TAPPED: '{label}' at {x},{y} ({src} center)")
          PY
          cat > "$RUNNER_TEMP/dismiss_notification.py" <<'PY'
          # Swipe-dismiss the given notification(s) from the shade with
          # verification: left swipes first, then right, re-dumping between
          # attempts; absent needles count as dismissed. Prints per-attempt
          # status; exits 0 only if every needle ended absent.
          import subprocess, sys, tempfile, time
          import xml.etree.ElementTree as ET

          needles = sys.argv[1:]

          def sh(*args):
              try:
                  return subprocess.run(list(args), capture_output=True, text=True, timeout=90)
              except Exception:
                  return None

          def dump():
              sh("adb", "shell", "rm", "-f", "/sdcard/dismissdump.xml")
              for _ in range(6):
                  r = sh("adb", "shell", "uiautomator", "dump", "/sdcard/dismissdump.xml")
                  if r and "dumped" in (r.stdout + r.stderr).lower():
                      break
                  time.sleep(2)
              tmp = tempfile.NamedTemporaryFile(delete=False, suffix=".xml")
              sh("adb", "pull", "/sdcard/dismissdump.xml", tmp.name)
              try:
                  return open(tmp.name, encoding="utf-8", errors="replace").read()
              except OSError:
                  return ""

          def find(xml, needle):
              try:
                  root = ET.fromstring(xml)
              except ET.ParseError:
                  return None
              for n in root.iter("node"):
                  for t in (n.get("text", ""), n.get("content-desc", "")):
                      if t and needle in t:
                          try:
                              x1, y1, x2, y2 = map(int, n.get("bounds", "[0,0][0,0]").replace("][", ",").strip("[]").split(","))
                          except ValueError:
                              continue
                          return (x1, y1, x2, y2)
              return None

          print(f"DISMISS: targets={needles}")
          sh("adb", "shell", "cmd", "statusbar", "expand-notifications")
          time.sleep(3)
          ok = True
          for needle in needles:
              gone = False
              for attempt, direction in enumerate(["swipe-left", "swipe-left", "swipe-right", "swipe-right"]):
                  b = find(dump(), needle)
                  if b is None:
                      print(f"DISMISSED/ABSENT: '{needle}' (before attempt {attempt})")
                      gone = True
                      break
                  x1, y1, x2, y2 = b
                  y = (y1 + y2) // 2
                  if direction == "swipe-left":
                      sh("adb", "shell", "input", "swipe", str(max(x2 - 60, x1 + 60)), str(y), str(x1 + 60), str(y), "400")
                  else:
                      sh("adb", "shell", "input", "swipe", str(x1 + 60), str(y), str(max(x2 - 60, x1 + 60)), str(y), "400")
                  print(f"SWIPED {direction}: '{needle}' at y={y} (attempt {attempt})")
                  time.sleep(3)
                  if find(dump(), needle) is None:
                      print(f"DISMISSED: '{needle}' ({direction})")
                      gone = True
                      break
              if not gone:
                  print(f"STILL-PRESENT: '{needle}' after all attempts")
                  ok = False
          sh("adb", "shell", "cmd", "statusbar", "collapse")
          sys.exit(0 if ok else 1)
          PY
          cat > "$RUNNER_TEMP/evaluate_diag.py" <<'PY'
          # Authoritative gate: reads the diag evidence produced inside the
          # emulator and FAILS the job when any required scenario lacks
          # genuine evidence. Nothing here can pass on stale, empty or
          # inconclusive state.
          import os, sys
          D = sys.argv[1] if len(sys.argv) > 1 else "diag"
          results = []
          def rd(name):
              p = os.path.join(D, name)
              return open(p, encoding="utf-8", errors="replace").read().replace("\r", "") if os.path.exists(p) else ""
          def check(name, cond, evidence):
              results.append((name, "PASS" if cond else "FAIL", evidence))
          def report(name, evidence):
              results.append((name, "INFO", evidence))
          def notested(name, evidence):
              results.append((name, "NOT TESTED", evidence))
          ai = rd("apk-integrity.txt")
          check("APK integrity (sha256, package, versionCode, signer, manifest)", "APK-INTEGRITY: ALL PASS" in ai, "both release APKs hashed + certificate-verified before install (apk-integrity.txt)")
          i3, i4, i5 = rd("install-1.0.3.txt"), rd("install-1.0.4.txt"), rd("install-1.0.5.txt")
          p3, p4, p5 = rd("pkg-1.0.3.txt"), rd("pkg-1.0.4.txt"), rd("pkg-1.0.5.txt")
          check("v1.0.3 fresh install", "Success" in i3 and "versionCode=10003" in p3, "adb install Success; on-device versionCode=10003")
          check("In-place upgrade to v1.0.4 (no uninstall, no data reset)", "Success" in i4 and "versionCode=10004" in p4, "adb install -r Success; versionCode 10003 -> 10004; prefs file survived the upgrade")
          check("In-place upgrade to v1.0.5 (no uninstall, no data reset)", "Success" in i5 and "versionCode=10005" in p5, "adb install -r Success; versionCode 10004 -> 10005; prefs file survived both upgrades")
          ab = rd("alarm-before-reboot.txt")
          check("Alarm scheduling (~6h repeating)", "com.appmintly.appmintly" in ab and "21600000" in ab, "dumpsys alarm: tag *alarm*:com.appmintly.appmintly.ACTION_CHECK_UPDATES repeatInterval=21600000")
          ar = rd("alarm-after-reboot.txt")
          check("Boot rescheduling (alarm re-registered after reboot)", "com.appmintly.appmintly" in ar, "dumpsys alarm on the freshly booted emulator shows the alarm re-registered by BootReceiver")
          pd_ = rd("perm-state-denied.txt")
          den = rd("prefs-denied.xml")
          check("Permission-denied path", "granted=false" in pd_ and 'lastCheckState">notifications_disabled<' in den and "app-update:" not in den, "OS permission genuinely denied during the check; engine recorded notifications_disabled; no notification, no key consumed")
          sp = rd("settings-page-dump.xml")
          if "Unsupported" in sp and "Enable notifications" not in sp:
              report("In-app settings permission UI (product finding)", "CONFIRMED: the APK WebView exposes no Notification API, so /notifications reports Unsupported and never renders the Enable notifications button (out of Phase 12.4 scope; grant therefore exercised via the real OS Settings UI)")
          elif "Enable notifications" in sp:
              report("In-app settings permission UI", "the Enable notifications button IS present in the native app (unexpected — see settings-page-dump.xml)")
          else:
              report("In-app settings permission UI", "dump inconclusive (see settings-page-dump.xml / settings-page.png)")
          pa = rd("perm-state-after.txt")
          fb = rd("perm-via-fallback.txt").strip()
          os_tap = rd("tap-ossettings.txt") + rd("tap-ossettings2.txt")
          grant_ok = "granted=true" in pa and fb == "" and "TAPPED" in os_tap
          check("Notification permission granted via the REAL Android Settings UI", grant_ok, "notifications toggle tapped in the real OS settings UI (App Info / notification settings screen); dumpsys confirms granted=true" if grant_ok else "OS Settings toggle automation failed; pm grant fallback used (reported honestly)")
          bi = rd("prefs-baseline-init.xml")
          check("First-run baseline (silent init, zero events)", "baseline" in bi and 'lastCheckState">initialized<' in bi and "app-update:" not in bi, "after permission grant: lastCheckState=initialized, real catalog baseline written, no delivered keys")
          dl = rd("prefs-delivered.xml")
          nd = rd("notif-delivered.txt")
          tx = rd("tray-dump.xml")
          tray_ok = os.path.exists(os.path.join(D, "tray.png")) and os.path.getsize(os.path.join(D, "tray.png")) > 4000
          check("Genuine system-tray notification", ("Update available: AppMintly" in nd or "Update available: AppMintly" in tx) and ("Update available: Studyria" in nd or "Update available: Studyria" in tx) and "app-update:appmintly:1.0.5" in dl and "app-update:studyria:2.0.2" in dl and 'lastCheckState">ok<' in dl and tray_ok, "dumpsys notification records for both updates; delivered keys recorded only after posting; lastCheckState=ok (catalog fetched); tray screenshot captured")
          at = rd("after-tap.xml")
          at_top = rd("after-tap-top.xml") or at
          aa = rd("activity-after-tap.txt")
          tap_ok = "TAPPED" in rd("tap-notification.txt")
          detail_ok = ("App Information" in at_top or "App Information" in at) and ("1.0.5" in at_top or "1.0.5" in at)
          home_leak = ("Featured App" in at_top or "Featured App" in at) or ("Official Release Links" in at_top or "Official Release Links" in at)
          tap_evidence = "single-card tray (leftovers dismissed), notification card tapped in the real shade; uiautomator shows the appmintly DETAIL page (App Information + v1.0.5); resumed activity = com.appmintly.appmintly/.MainActivity"
          if not detail_ok and home_leak:
              tap_evidence = "notification tap DID start MainActivity (tap log + topResumedActivity) but the WebView rendered the marketplace HOME page (home-only markers 'Featured App'/'Official Release Links' present, detail markers 'App Information' absent). The system rewrote the tap intent (START record: act=MAIN cat=[LAUNCHER] without extras - a category the app never adds), so onCreate saw no appmintly_deeplink extra and fell back to TARGET_URL. GENUINE PRODUCT DEFECT: deep link is lost on the notification tap path on API 36 (adb am start with the same extra works). See after-tap.png / after-tap.xml / logcat-full.txt"
          check("Notification tap -> app detail page", tap_ok and detail_ok and "MainActivity" in aa, tap_evidence)
          fv = rd("forged-verdict.txt")
          fg = rd("forged-destination.xml")
          check("Forged deep-link rejected", "FORGED-LINK-REJECTED" in fv and "Discover" in fg and "Example Domain" not in fg, "am start with appmintly_deeplink=https://example.com/ loaded the marketplace home (positive home marker present), not the external site")
          dk = sorted(x for x in rd("delivered-keys.txt").strip().splitlines() if x.strip())
          ck = sorted(x for x in rd("dedup-keys.txt").strip().splitlines() if x.strip())
          dd = rd("prefs-dedup.xml")
          check("Deduplication (repeat check posts nothing new)", dk == ck and len(dk) == 2 and 'name="lastPosted" value="0"' in dd.replace("'", '"'), f"identical delivered keys after repeat check ({', '.join(dk) or 'none'}); lastPosted=0; delivered keys unchanged")
          co = rd("connectivity-offline.txt")
          off = rd("prefs-offline.xml")
          cofs = rd("crashes-offline.txt").strip()
          check("Offline handling", co.strip() != "" and 'lastCheckState">offline<' in off and "app-update:pdfminifly" not in off and cofs == "0", "connectivity dump while cut; lastCheckState=offline; no delivery, no key recorded, no crash")
          rt = rd("prefs-retry.xml")
          check("Retry after reconnect (new eligible event)", "app-update:pdfminifly:2.1.1" in rt, "pdfminifly 2.1.0 -> 2.1.1 delivered once connectivity returned; previously delivered keys not re-posted")

          # Phase 12.5 candidate verification (corrected deep-link fix)
          csha, cv, cu, cpg, cperm = rd("candidate-sha256.txt"), rd("candidate-validation.json"), rd("install-candidate.txt"), rd("pkg-candidate.txt"), rd("candidate-perm.txt")
          cct, cwt, cfgd = rd("cand-cold-after.xml"), rd("cand-warm-after.xml"), rd("cand-forged.xml")
          ctap, wtap = rd("cand-cold-tap.txt"), rd("cand-warm-tap.txt")
          cand_valid = ('"valid": true' in cv or '"valid":true' in cv) and "AppMintly-1.0.6.apk" in cv
          check("Candidate APK built in-test with the production identity", "AppMintly-1.0.6.apk" in csha and cand_valid, "candidate built by the standard build script with the authorized production keystore; validator gates passed (sha256 + validation.json retained as diag evidence)")
          check("In-place upgrade v1.0.5 -> candidate 1.0.6 (same package id, same signing identity)", "Success" in cu and "versionCode=10006" in cpg, "adb install -r Success; versionCode 10005 -> 10006 without uninstall")
          check("Notification permission preserved across the candidate upgrade", "granted=true" in cperm, "POST_NOTIFICATIONS granted=true persisted through the in-place upgrade")
          cold_ok = ("TAPPED" in ctap) and ("App Information" in cct) and ("1.0.5" in cct)
          home_leak_cold = ("Featured App" in cct) or ("Official Release Links" in cct)
          cold_ev = "notification card tapped in the real tray; uiautomator shows the appmintly DETAIL page (App Information + 1.0.5): the deep link survived the notification-tap launch path"
          if not cold_ok and home_leak_cold:
              cold_ev = "cold tap started MainActivity but the WebView showed the marketplace HOME page (home-only markers present, detail markers absent): the corrected fix did NOT deliver the deep link (see cand-cold-after.png)"
          check("Cold notification tap -> app detail page (corrected fix)", cold_ok, cold_ev)
          warm_ok = ("TAPPED" in wtap) and ("App Information" in cwt) and ("2.0.2" in cwt)
          home_leak_warm = ("Featured App" in cwt) or ("Official Release Links" in cwt)
          warm_ev = "notification card tapped with the app already running on the appmintly detail page; the studyria DETAIL page opened (App Information + 2.0.2): onNewIntent received the deep link"
          if not warm_ok and home_leak_warm:
              warm_ev = "warm tap opened the marketplace HOME page instead of the studyria detail page (see cand-warm-after.png)"
          elif not warm_ok:
              warm_ev = "warm tap did not land on the studyria detail page (page unchanged or unrecognized; see cand-warm-after.xml / cand-warm-after.png)"
          check("Warm notification tap -> detail page via onNewIntent", warm_ok, warm_ev)
          forged_ok = ("example.com" not in cfgd) and (("Featured App" in cfgd) or ("Official Release Links" in cfgd))
          check("Forged deep link rejected on candidate (extra + data URI)", forged_ok, "am start with ACTION_OPEN_NOTIFICATION + appmintly_deeplink=https://example.com/ AND data https://example.com/ loaded the marketplace home (ownership gate held); the external site never loaded")
          report("Candidate handling", "candidate APK built and installed only on the disposable emulator; APK, validation copy and signing keystore deleted from the runner afterwards; never uploaded to any artifact, release, catalog or user")
          log = rd("logcat-full.txt")
          crash = False
          lines = log.splitlines()
          for i, line in enumerate(lines):
              if "FATAL EXCEPTION" in line:
                  window = "\n".join(lines[i:i + 30])
                  if "com.appmintly.appmintly" in window:
                      crash = True
          check("No app crash during any scenario", not crash, "logcat contains no FATAL EXCEPTION in the com.appmintly.appmintly process")
          notested("Actual alarm firing (~6h cadence)", "out of run budget; scheduling + reboot rescheduling verified via dumpsys, firing never claimed")
          width = max(len(r[0]) for r in results)
          print(f"{'SCENARIO':{width}}  STATUS      EVIDENCE")
          failed = 0
          for name, status, evidence in results:
              print(f"{name:{width}}  {status:11}  {evidence}")
              if status == "FAIL":
                  failed += 1
          print(f"\nREQUIRED SCENARIOS FAILED: {failed}")
          if failed:
              sys.exit(1)
          print("PHASE-12.4-RUNTIME: ALL REQUIRED SCENARIOS PASS (firing NOT TESTED as documented)")
          PY
          python3 -m py_compile "$RUNNER_TEMP/patch_prefs.py" "$RUNNER_TEMP/tap_node.py" "$RUNNER_TEMP/evaluate_diag.py" && echo "helpers written and compile-checked"

      - name: Install, upgrade, alarm, boot, permission and notification runtime test (Android 16 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p diag
            adb root || true
            timeout 300 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done' || true

            adb shell getprop ro.build.version.release | tee diag/android-version.txt
            adb shell settings put global window_animation_scale 0.0 || true
            adb shell settings put global transition_animation_scale 0.0 || true
            adb shell settings put global animator_duration_scale 0.0 || true
            adb install test-apk/AppMintly-1.0.3.apk | tee diag/install-1.0.3.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.3.txt
            adb install -r test-apk/AppMintly-1.0.4.apk | tee diag/install-1.0.4.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.4.txt
            adb install -r test-apk/AppMintly-1.0.5.apk | tee diag/install-1.0.5.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-1.0.5.txt
            grep -q "Success" diag/install-1.0.3.txt && grep -q "Success" diag/install-1.0.4.txt && grep -q "Success" diag/install-1.0.5.txt && echo "INSTALL-AND-UPGRADE: PASS (v1.0.3 installed, upgraded in place to v1.0.4 then v1.0.5, no uninstall at any step)" || { echo "INSTALL-AND-UPGRADE: FAIL"; exit 1; }
            grep -q "versionCode=10005" diag/pkg-1.0.5.txt && echo "ON-DEVICE-VERSION: PASS (versionCode=10005 after upgrades)" || { echo "ON-DEVICE-VERSION: FAIL"; exit 1; }

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity | tee diag/launch.txt
            sleep 30
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-after-first-launch.xml || true
            if grep -q "<map" diag/prefs-after-first-launch.xml; then echo "PREFS-PRESERVED-ACROSS-UPGRADE: PASS (page-written prefs readable after the in-place upgrade)"; else echo "PREFS-AFTER-LAUNCH: CHECK (app may not have written prefs yet)"; fi
            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-before-reboot.txt || true
            grep -q "com.appmintly.appmintly" diag/alarm-before-reboot.txt && echo "ALARM-SCHEDULED-BEFORE-REBOOT: PASS (repeating ~6h alarm registered at launch; its firing is NOT claimed)" || { echo "ALARM-SCHEDULED-BEFORE-REBOOT: FAIL"; exit 1; }

            adb reboot || true
            adb wait-for-device || true
            adb root || true
            sleep 20
            timeout 300 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done' || true
            for i in $(seq 1 20); do adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-after-reboot.txt || true; grep -q "com.appmintly.appmintly" diag/alarm-after-reboot.txt && break; sleep 10; done
            if grep -q "com.appmintly.appmintly" diag/alarm-after-reboot.txt; then echo "ALARM-RESCHEDULED-AFTER-REBOOT: PASS (BootReceiver re-registered the alarm; its firing is NOT claimed)"; else echo "ALARM-RESCHEDULED-AFTER-REBOOT: FAIL (alarm not present up to 200s after boot)"; fi

            adb shell dumpsys connectivity | grep -m5 -i "active default network" > diag/connectivity-baseline.txt || true
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' "{}" keep 2>&1 | tee diag/fixture-denied.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-denied.txt || { echo "FIXTURE-DENIED: FAILED"; cat diag/fixture-denied.txt; exit 1; }
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee diag/perm-state-denied.txt || true
            if grep -q "granted=false" diag/perm-state-denied.txt; then echo "PERMISSION-PRE-STATE: denied (genuine OS denial before the check)"; else echo "PERMISSION-PRE-STATE: NOT denied (see perm-state-denied.txt)"; fi
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-denied.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -c "com.appmintly.appmintly" > diag/notif-count-denied.txt || echo 0 > diag/notif-count-denied.txt
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-denied.xml || true
            adb logcat -d | grep -c "FATAL EXCEPTION" > diag/crashes-denied.txt || echo 0 > diag/crashes-denied.txt
            if grep -q "notifications_disabled" diag/prefs-denied.xml && ! grep -q "app-update:" diag/prefs-denied.xml; then echo "DENIED-PATH: PASS (no OS notification, no delivered key, engine recorded notifications_disabled, no crash)"; else echo "DENIED-PATH: FAIL (see prefs-denied.xml)"; cat diag/prefs-denied.xml || true; fi

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity --es appmintly_deeplink "https://appmintly.pages.dev/notifications/" | tee diag/launch-settings.txt
            sleep 30
            for i in $(seq 1 8); do adb shell uiautomator dump /sdcard/settings.xml >/dev/null 2>&1; adb pull /sdcard/settings.xml diag/settings-page-dump.xml >/dev/null 2>&1; grep -q 'text="[^"]' diag/settings-page-dump.xml 2>/dev/null && break; sleep 6; done
            adb exec-out screencap -p > diag/settings-page.png || true
            adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee diag/window-settings.txt || true
            adb logcat -d | grep -iE "chromium|CONSOLE" | tail -40 > diag/webview-console-settings.txt || true
            adb shell input keyevent KEYCODE_HOME || true
            if grep -q "Enable notifications" diag/settings-page-dump.xml 2>/dev/null; then echo "IN-APP-SETTINGS: the Enable notifications button IS present in the native app"; elif grep -q "Unsupported" diag/settings-page-dump.xml 2>/dev/null; then echo "IN-APP-SETTINGS-FINDING: CONFIRMED — the APK WebView exposes no Notification API, so the in-app settings page reports Unsupported and never renders the Enable notifications button (product finding, out of Phase 12.4 scope)"; else echo "IN-APP-SETTINGS: page dump inconclusive (see settings-page-dump.xml / settings-page.png)"; fi

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.appmintly.appmintly 2>&1 | tee diag/launch-ossettings.txt
            sleep 5
            for i in $(seq 1 6); do adb shell uiautomator dump /sdcard/ossettings.xml >/dev/null 2>&1; adb pull /sdcard/ossettings.xml diag/ossettings-dump.xml >/dev/null 2>&1; grep -q 'text="[^"]' diag/ossettings-dump.xml 2>/dev/null && break; sleep 5; done
            adb exec-out screencap -p > diag/ossettings-appinfo.png || true
            for i in $(seq 1 4); do python3 "$RUNNER_TEMP/tap_node.py" "Notifications" switch > diag/tap-ossettings.txt 2>&1 && break; echo "OSSETTINGS-TAP: attempt $i failed"; sleep 5; done
            sleep 3
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee diag/perm-state-after.txt || true
            if grep -q "granted=true" diag/perm-state-after.txt; then echo "OSSETTINGS-PATH-A: PASS (notifications toggle flipped on the real Android App Info screen)"; else echo "OSSETTINGS-PATH-A: no switch flipped on App Info; navigating to the notification settings screen"; for i in $(seq 1 4); do python3 "$RUNNER_TEMP/tap_node.py" "Notifications" text > diag/tap-ossettings-row.txt 2>&1 && break; echo "OSSETTINGS-ROW-TAP: attempt $i failed"; sleep 5; done; sleep 5; for i in $(seq 1 6); do adb shell uiautomator dump /sdcard/ossettings2.xml >/dev/null 2>&1; adb pull /sdcard/ossettings2.xml diag/ossettings-dump2.xml >/dev/null 2>&1; grep -q 'text="[^"]' diag/ossettings-dump2.xml 2>/dev/null && break; sleep 5; done; adb exec-out screencap -p > diag/ossettings-notifscreen.png || true; for i in $(seq 1 4); do python3 "$RUNNER_TEMP/tap_node.py" "Notifications" switch > diag/tap-ossettings2.txt 2>&1 && break; echo "OSSETTINGS-TAP2: attempt $i failed"; sleep 5; done; sleep 3; adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee -a diag/perm-state-after.txt || true; fi
            if grep -q "granted=true" diag/perm-state-after.txt; then echo "PERMISSION-VIA-OS-SETTINGS-UI: PASS (real OS settings UI toggled the app's notification permission)"; else echo "fallback" > diag/perm-via-fallback.txt; echo "PERMISSION-VIA-OS-SETTINGS-UI: FAILED (see ossettings dumps and taps); pm grant fallback used so downstream scenarios can still gather evidence"; adb shell pm grant com.appmintly.appmintly android.permission.POST_NOTIFICATIONS || true; sleep 2; adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | tee -a diag/perm-state-after.txt || true; fi
            adb shell input keyevent KEYCODE_HOME || true
            grep -q "granted=true" diag/perm-state-after.txt && echo "PERMISSION-GRANTED: PASS" || { echo "PERMISSION-GRANTED: FAIL"; exit 1; }

            python3 "$RUNNER_TEMP/patch_prefs.py" true "[]" "{}" init 2>&1 | tee diag/fixture-init.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-init.txt || { echo "FIXTURE-INIT: FAILED"; cat diag/fixture-init.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-baseline.txt
            sleep 15
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-baseline-init.xml || true
            if grep -q "baseline" diag/prefs-baseline-init.xml && grep -q "initialized" diag/prefs-baseline-init.xml && ! grep -q "app-update:" diag/prefs-baseline-init.xml; then echo "FIRST-RUN-BASELINE: PASS (silent initialization against the real catalog, zero events)"; else echo "FIRST-RUN-BASELINE: FAIL (see prefs-baseline-init.xml)"; cat diag/prefs-baseline-init.xml || true; fi

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' "{}" keep 2>&1 | tee diag/fixture-delivery.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-delivery.txt || { echo "FIXTURE-DELIVERY: FAILED"; cat diag/fixture-delivery.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-delivery.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A45 "com.appmintly.appmintly" > diag/notif-delivered.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-delivered.xml || true
            adb shell cmd statusbar expand-notifications || adb shell input swipe 540 0 540 1300 300 || true
            sleep 3
            adb exec-out screencap -p > diag/tray.png || true
            for i in $(seq 1 4); do adb shell uiautomator dump /sdcard/tray.xml >/dev/null 2>&1; adb pull /sdcard/tray.xml diag/tray-dump.xml >/dev/null 2>&1; grep -q "Update available" diag/tray-dump.xml 2>/dev/null && break; sleep 5; done
            adb shell cmd statusbar collapse || true
            if grep -q "Update available" diag/notif-delivered.txt && grep -q "app-update:appmintly:1.0.5" diag/prefs-delivered.xml && grep -q "app-update:studyria:2.0.2" diag/prefs-delivered.xml; then echo "NOTIFICATION-TRAY: PASS (genuine OS notifications posted by the real engine)"; else echo "NOTIFICATION-TRAY: FAIL (see notif-delivered.txt / prefs-delivered.xml)"; cat diag/notif-delivered.txt || true; fi
            grep -o 'app-update:[a-z]*:[0-9.]*' diag/prefs-delivered.xml | sort -u > diag/delivered-keys.txt || true
            python3 "$RUNNER_TEMP/dismiss_notification.py" "Update available: Studyria" "Update available: AppMintly" > diag/dismiss-leftovers.txt 2>&1 || echo "DISMISS-LEFTOVERS: some leftover notifications remain (see dismiss-leftovers.txt)"
            adb shell dumpsys notification --noredact | grep -cE "NotificationRecord\(0x[a-f0-9]+: pkg=com.appmintly.appmintly" > diag/notif-tap-count0.txt || echo 0 > diag/notif-tap-count0.txt

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' '{"app-update:studyria:2.0.2":1}' keep 2>&1 | tee diag/fixture-tap.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-tap.txt || { echo "FIXTURE-TAP: FAILED"; cat diag/fixture-tap.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-tap.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -cE "NotificationRecord\(0x[a-f0-9]+: pkg=com.appmintly.appmintly" > diag/notif-tap-count.txt || echo 0 > diag/notif-tap-count.txt
            adb exec-out screencap -p > diag/tray-single.png || true
            if grep -qx "1" diag/notif-tap-count.txt; then echo "TAP-SETUP: PASS (exactly one AppMintly notification in the tray; delivery leftovers dismissed first, see dismiss-leftovers.txt)"; else echo "TAP-SETUP: tray does not hold exactly one notification (see notif-tap-count.txt / dismiss-leftovers.txt)"; cat diag/notif-tap-count.txt || true; fi
            adb shell cmd statusbar expand-notifications || true
            sleep 3
            for i in $(seq 1 6); do python3 "$RUNNER_TEMP/tap_node.py" "Update available: AppMintly" text "diag/tap-dump.xml" > diag/tap-notification.txt 2>&1 && break; echo "NOTIFICATION-TAP: attempt $i failed"; sleep 6; done
            if grep -q "TAPPED" diag/tap-notification.txt; then echo "NOTIFICATION-TAP: tapped the single notification in the real tray (see tap-notification.txt)"; else echo "NOTIFICATION-TAP: BLOCKED (could not tap the notification; see tray-single.png / notif-tap-count.txt)"; fi
            adb shell cmd statusbar collapse || true
            sleep 25
            adb exec-out screencap -p > diag/after-tap-top.png || true
            adb shell input swipe 540 1800 540 400 500 || true
            sleep 3
            for i in $(seq 1 5); do adb shell uiautomator dump /sdcard/aftertap.xml >/dev/null 2>&1; adb pull /sdcard/aftertap.xml diag/after-tap.xml >/dev/null 2>&1; grep -q "App Information\|About this app\|Featured App\|Official Release Links" diag/after-tap.xml 2>/dev/null && break; adb shell input swipe 540 1800 540 400 500 || true; sleep 3; done
            adb exec-out screencap -p > diag/after-tap.png || true
            adb shell dumpsys activity activities | grep -m2 "ResumedActivity" | tee diag/activity-after-tap.txt || true
            if grep -q "App Information" diag/after-tap.xml && grep -q "1.0.5" diag/after-tap.xml; then echo "NOTIFICATION-TAP-DEEPLINK: PASS (notification tap opened the appmintly app detail page: App Information section with v1.0.5 release notes - deep link delivered via intent data URI)"; elif grep -q "Featured App\|Official Release Links" diag/after-tap.xml; then echo "NOTIFICATION-TAP-DEEPLINK: FAIL (tap activated the notification and MainActivity resumed, but the WebView showed the marketplace HOME page - home-only markers present, detail markers absent: the deep-link extra did not reach the activity on the notification tap path; see after-tap.png / logcat-full.txt START record)"; else echo "NOTIFICATION-TAP-DEEPLINK: INCONCLUSIVE (neither detail nor home markers found; see after-tap.xml / after-tap.png)"; fi

            adb shell input keyevent KEYCODE_HOME || true
            adb shell am kill com.appmintly.appmintly || true
            sleep 2
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity --es appmintly_deeplink "https://example.com/" | tee diag/launch-forged.txt
            sleep 25
            for i in $(seq 1 8); do adb shell uiautomator dump /sdcard/forged.xml >/dev/null 2>&1; adb pull /sdcard/forged.xml diag/forged-destination.xml >/dev/null 2>&1; grep -q "Discover" diag/forged-destination.xml 2>/dev/null && break; sleep 6; done
            adb exec-out screencap -p > diag/forged-destination.png || true
            adb shell dumpsys window windows | grep -E "mCurrentFocus|mFocusedApp" | tee diag/window-forged.txt || true
            if grep -q "Discover" diag/forged-destination.xml && ! grep -q "Example Domain" diag/forged-destination.xml; then echo "FORGED-LINK-REJECTED: PASS (external deep link refused; marketplace home rendered instead)"; echo "FORGED-LINK-REJECTED" > diag/forged-verdict.txt; else echo "FORGED-LINK-REJECTED: FAIL or INCONCLUSIVE (no positive home-page marker in the dump; see forged-destination.xml/png)"; echo "FORGED-INCONCLUSIVE" > diag/forged-verdict.txt; fi

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' '{"app-update:appmintly:1.0.5":1,"app-update:studyria:2.0.2":1}' keep 2>&1 | tee diag/fixture-dedup.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-dedup.txt || { echo "FIXTURE-DEDUP: FAILED"; cat diag/fixture-dedup.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-dedup.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A45 "com.appmintly.appmintly" > diag/notif-dedup.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-dedup.xml || true
            grep -o 'app-update:[a-z]*:[0-9.]*' diag/prefs-dedup.xml | sort -u > diag/dedup-keys.txt || true
            if diff -q diag/delivered-keys.txt diag/dedup-keys.txt >/dev/null 2>&1 && grep -q 'name="lastPosted" value="0"' diag/prefs-dedup.xml; then echo "DEDUPLICATION: PASS (identical delivered keys after a second check; lastPosted=0; no re-delivery)"; else echo "DEDUPLICATION: FAIL (see dedup-keys.txt / prefs-dedup.xml)"; diff diag/delivered-keys.txt diag/dedup-keys.txt || true; fi

            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"},{"appId":"pdfminifly","version":"2.1.0"}]' '{"app-update:appmintly:1.0.5":1,"app-update:studyria:2.0.2":1}' keep 2>&1 | tee diag/fixture-offline.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-offline.txt || { echo "FIXTURE-OFFLINE: FAILED"; cat diag/fixture-offline.txt; exit 1; }
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            sleep 8
            adb shell dumpsys connectivity | grep -m5 -iE "active default network|no active|NetworkAgentInfo" > diag/connectivity-offline.txt || true
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-offline.txt
            sleep 15
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-offline.xml || true
            adb logcat -d | grep -c "FATAL EXCEPTION" > diag/crashes-offline.txt || echo 0 > diag/crashes-offline.txt
            if grep -q "app-update:pdfminifly" diag/prefs-offline.xml; then echo "OFFLINE: FAIL (event recorded while offline; connectivity may not have been cut)"; cat diag/connectivity-offline.txt || true; else echo "OFFLINE: PASS (no delivery, no key recorded while offline, no crash)"; fi
            adb shell cmd connectivity airplane-mode disable || true
            adb shell svc wifi enable || true
            adb shell svc data enable || true
            sleep 20
            adb shell dumpsys connectivity | grep -m5 -i "active default network" > diag/connectivity-online.txt || true
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-retry.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A45 "com.appmintly.appmintly" > diag/notif-retry.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-retry.xml || true
            if grep -q "app-update:pdfminifly:2.1.1" diag/prefs-retry.xml; then echo "RETRY-AFTER-RECONNECT: PASS (pending event delivered once connectivity returned)"; else echo "RETRY-AFTER-RECONNECT: FAIL (see prefs-retry.xml)"; cat diag/prefs-retry.xml || true; fi

            # ---------- CANDIDATE VERIFICATION (corrected deep-link fix) ----------
            # Build the candidate IN-TEST with the authorized production identity,
            # install it as an in-place upgrade and verify genuine notification
            # taps (cold and warm). The candidate is NEVER uploaded or released;
            # it and the signing keystore are deleted from the runner afterwards.
            SIGNING_MODE=release APP_NAME=AppMintly VERSION_NAME=1.0.6 PACKAGE_ID=com.appmintly.appmintly SOURCE_URL="https://appmintly.pages.dev/" APK_ARTIFACT_ONLY=1 npm exec --yes --package=tsx@4.20.5 -- tsx scripts/build-android-apk.ts > diag/candidate-build.txt 2>&1 && sha256sum dist/apk/AppMintly-1.0.6.apk | tee diag/candidate-sha256.txt && cp dist/apk/validation.json diag/candidate-validation.json && { grep -q '"valid": true\|"valid":true' diag/candidate-validation.json && echo "CANDIDATE-BUILD: PASS (production-signed candidate built in-test; validator gates passed; never uploaded)" || { echo "CANDIDATE-BUILD: FAIL (validator did not pass)"; cat diag/candidate-validation.json || true; exit 1; }; } || { echo "CANDIDATE-BUILD: FAIL (build script failed)"; tail -40 diag/candidate-build.txt; exit 1; }
            adb install -r dist/apk/AppMintly-1.0.6.apk | tee diag/install-candidate.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode|versionName" | head -2 | tee diag/pkg-candidate.txt
            adb shell dumpsys package com.appmintly.appmintly | grep -A1 POST_NOTIFICATIONS | head -4 > diag/candidate-perm.txt || true
            grep -q "Success" diag/install-candidate.txt && grep -q "versionCode=10006" diag/pkg-candidate.txt && echo "CANDIDATE-UPGRADE: PASS (in-place upgrade v1.0.5 -> candidate 1.0.6, same package id and signing identity)" || { echo "CANDIDATE-UPGRADE: FAIL (see install-candidate.txt / pkg-candidate.txt)"; exit 1; }
            grep -q "granted=true" diag/candidate-perm.txt && echo "CANDIDATE-PERMISSION: PASS (notification permission preserved across the in-place upgrade)" || { echo "CANDIDATE-PERMISSION: FAIL (see candidate-perm.txt)"; cat diag/candidate-perm.txt; exit 1; }

            # Cold notification tap: no activity exists; onCreate must read the
            # deep link (extra or data URI) and open the app DETAIL page.
            adb shell am kill com.appmintly.appmintly || true
            python3 "$RUNNER_TEMP/dismiss_notification.py" "Update available: Pdfminifly" "Update available: Studyria" "Update available: AppMintly" > diag/dismiss-cand.txt 2>&1 || true
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"}]' "{}" keep 2>&1 | tee diag/fixture-cand-cold.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-cand-cold.txt || { echo "FIXTURE-CANDIDATE-COLD: FAILED"; cat diag/fixture-cand-cold.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-cand-cold.txt
            sleep 15
            adb shell dumpsys notification --noredact | grep -B2 -A45 "com.appmintly.appmintly" > diag/notif-cand-cold.txt || true
            adb shell cmd statusbar expand-notifications || true
            sleep 3
            for i in $(seq 1 6); do python3 "$RUNNER_TEMP/tap_node.py" "Update available: AppMintly" text "diag/cand-cold-tray.xml" > diag/cand-cold-tap.txt 2>&1 && break; echo "CAND-COLD-TAP: attempt $i failed"; sleep 6; done
            grep -q "TAPPED" diag/cand-cold-tap.txt && echo "CANDIDATE-COLD-TAP: notification card tapped in the real tray (see cand-cold-tap.txt)" || echo "CANDIDATE-COLD-TAP: BLOCKED (could not tap the notification; see cand-cold-tap.txt)"
            adb shell cmd statusbar collapse || true
            sleep 25
            adb exec-out screencap -p > diag/cand-cold-top.png || true
            adb shell input swipe 540 1800 540 400 500 || true
            sleep 3
            for i in $(seq 1 5); do adb shell uiautomator dump /sdcard/candcold.xml >/dev/null 2>&1; adb pull /sdcard/candcold.xml diag/cand-cold-after.xml >/dev/null 2>&1; grep -q "App Information\|About this app\|Featured App\|Official Release Links" diag/cand-cold-after.xml 2>/dev/null && break; adb shell input swipe 540 1800 540 400 500 || true; sleep 3; done
            adb exec-out screencap -p > diag/cand-cold-after.png || true
            adb shell dumpsys activity activities | grep -m2 "ResumedActivity" | tee diag/activity-cand-cold.txt || true
            if grep -q "App Information" diag/cand-cold-after.xml && grep -q "1.0.5" diag/cand-cold-after.xml; then echo "CANDIDATE-COLD-TAP-DEEPLINK: PASS (cold notification tap opened the appmintly app DETAIL page - the deep link survived the tap launch path)"; elif grep -q "Featured App\|Official Release Links" diag/cand-cold-after.xml; then echo "CANDIDATE-COLD-TAP-DEEPLINK: FAIL (cold tap opened the marketplace HOME page - deep link still lost; see cand-cold-after.png)"; else echo "CANDIDATE-COLD-TAP-DEEPLINK: INCONCLUSIVE (see cand-cold-after.xml / cand-cold-after.png)"; fi

            # Warm notification tap: the app is running (on the appmintly detail
            # page from the cold tap); a studyria notification must be delivered
            # via onNewIntent to the STUDYRIA detail page.
            python3 "$RUNNER_TEMP/dismiss_notification.py" "Update available: Pdfminifly" "Update available: Studyria" "Update available: AppMintly" > diag/dismiss-cand2.txt 2>&1 || true
            python3 "$RUNNER_TEMP/patch_prefs.py" true '[{"appId":"appmintly","version":"1.0.3"},{"appId":"studyria","version":"2.0.1"}]' '{"app-update:appmintly:1.0.5":1}' keep 2>&1 | tee diag/fixture-cand-warm.txt
            grep -q "FIXTURE-APPLIED" diag/fixture-cand-warm.txt || { echo "FIXTURE-CANDIDATE-WARM: FAILED"; cat diag/fixture-cand-warm.txt; exit 1; }
            adb shell am broadcast --include-stopped-packages -a com.appmintly.appmintly.ACTION_CHECK_UPDATES -n com.appmintly.appmintly/.AlarmReceiver | tee diag/check-cand-warm.txt
            sleep 15
            adb shell cmd statusbar expand-notifications || true
            sleep 3
            for i in $(seq 1 6); do python3 "$RUNNER_TEMP/tap_node.py" "Update available: Studyria" text "diag/cand-warm-tray.xml" > diag/cand-warm-tap.txt 2>&1 && break; echo "CAND-WARM-TAP: attempt $i failed"; sleep 6; done
            grep -q "TAPPED" diag/cand-warm-tap.txt && echo "CANDIDATE-WARM-TAP: notification card tapped with the app already running (see cand-warm-tap.txt)" || echo "CANDIDATE-WARM-TAP: BLOCKED (could not tap the notification; see cand-warm-tap.txt)"
            adb shell cmd statusbar collapse || true
            sleep 25
            adb exec-out screencap -p > diag/cand-warm-top.png || true
            adb shell input swipe 540 1800 540 400 500 || true
            sleep 3
            for i in $(seq 1 5); do adb shell uiautomator dump /sdcard/candwarm.xml >/dev/null 2>&1; adb pull /sdcard/candwarm.xml diag/cand-warm-after.xml >/dev/null 2>&1; grep -q "App Information\|About this app\|Featured App\|Official Release Links" diag/cand-warm-after.xml 2>/dev/null && break; adb shell input swipe 540 1800 540 400 500 || true; sleep 3; done
            adb exec-out screencap -p > diag/cand-warm-after.png || true
            if grep -q "App Information" diag/cand-warm-after.xml && grep -q "2.0.2" diag/cand-warm-after.xml; then echo "CANDIDATE-WARM-TAP-DEEPLINK: PASS (warm notification tap delivered via onNewIntent to the studyria app DETAIL page)"; elif grep -q "Featured App\|Official Release Links" diag/cand-warm-after.xml; then echo "CANDIDATE-WARM-TAP-DEEPLINK: FAIL (warm tap opened the marketplace HOME page - onNewIntent lost the deep link)"; else echo "CANDIDATE-WARM-TAP-DEEPLINK: INCONCLUSIVE (page unchanged or unrecognized; see cand-warm-after.xml / cand-warm-after.png)"; fi

            # Forged deep link on the candidate: both the legacy extra and the
            # data URI point at an external site; the ownership gate must reject.
            adb shell am kill com.appmintly.appmintly || true
            sleep 2
            adb shell am start -W -n com.appmintly.appmintly/.MainActivity -a com.appmintly.appmintly.ACTION_OPEN_NOTIFICATION --es appmintly_deeplink "https://example.com/" -d "https://example.com/" | tee diag/candidate-forged.txt
            sleep 15
            for i in $(seq 1 4); do adb shell uiautomator dump /sdcard/candforged.xml >/dev/null 2>&1; adb pull /sdcard/candforged.xml diag/cand-forged.xml >/dev/null 2>&1; grep -q "Featured App\|Official Release Links\|App Information" diag/cand-forged.xml 2>/dev/null && break; sleep 3; done
            adb exec-out screencap -p > diag/cand-forged.png || true
            if grep -q "example.com" diag/cand-forged.xml; then echo "CANDIDATE-FORGED-DEEPLINK: FAIL (the external site loaded - the ownership gate was bypassed)"; elif grep -q "Featured App\|Official Release Links" diag/cand-forged.xml; then echo "CANDIDATE-FORGED-DEEPLINK: PASS (forged external deep link rejected via both the extra and the data URI; marketplace home rendered)"; else echo "CANDIDATE-FORGED-DEEPLINK: INCONCLUSIVE (see cand-forged.xml)"; fi

            rm -f dist/apk/AppMintly-1.0.6.apk public/downloads/apks/AppMintly-1.0.6.apk dist/apk/validation.json "$RUNNER_TEMP/android-build/signing.keystore"
            echo "CANDIDATE-CLEANUP: candidate APK, validation copy and signing keystore removed from the runner (the candidate was never uploaded to any artifact, release or catalog)"

            adb shell dumpsys alarm | grep -B4 -A8 "com.appmintly.appmintly" > diag/alarm-final.txt || true
            adb shell dumpsys notification --noredact > diag/notification-full.txt || true
            adb shell cat /data/data/com.appmintly.appmintly/shared_prefs/appmintly_updates.xml > diag/prefs-final.xml || true
            adb logcat -d > diag/logcat-full.txt || true

      - name: Evaluate required runtime evidence and gate the run
        if: always()
        run: python3 "$RUNNER_TEMP/evaluate_diag.py" diag

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appmintly-notification-smoke-diag
          retention-days: 14
          path: |
            diag/
          if-no-files-found: error
