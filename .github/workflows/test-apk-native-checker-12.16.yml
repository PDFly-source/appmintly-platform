name: Immediate native checker diagnostic APK (Phase 12.16)
run-name: "TEMPORARY TEST BUILD - immediate native checker diagnostic (NOT FOR PRODUCTION)"

# Phase 12.16: builds a THROWAWAY-signed, ARTIFACT-ONLY diagnostic APK
# that triggers the REAL native update checker immediately (2-minute
# WAKEUP alarm, test build only) with a self-healing fixture seed:
# fixture inputs (master on, stale tracked versions) re-asserted before
# the gate on every fire, the delivered dedup map seeded once and then
# preserved - so every tick after the first runs the real gates, catalog
# fetch, version detection, DEDUP and delivery. Never creates a release,
# never publishes, never touches the production catalog, never accesses
# production signing secrets, and never merges toward main. Runs only
# from this test branch (the file exists nowhere else).
on:
  # Triggers only on pushes to THIS test branch (manual dispatch requires
  # the workflow to also exist on main, which is forbidden here).
  push:
    branches:
      - test/native-checker-12.16
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checker-12-16-test-apk
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  SIGNING_MODE: release
  APK_ARTIFACT_ONLY: '1'

jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick zip unzip

      - name: Prepare compiler and THROWAWAY test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-build"
          curl --fail --location --silent --show-error \
            'https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar' \
            -o "$RUNNER_TEMP/android-build/r8.jar"
          test -s "$RUNNER_TEMP/android-build/r8.jar"
          # THROWAWAY key: generated fresh in this runner, deleted with it.
          # No production signing secret is referenced anywhere in this file.
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/android-build/signing.keystore" \
            -storepass 'throwaway-test-password' -keypass 'throwaway-test-password' \
            -alias 'throwaway-test-key' -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=AppMintly Temporary Test Build, OU=Test, O=Test, C=IN'
          keytool -list -keystore "$RUNNER_TEMP/android-build/signing.keystore" \
            -storepass 'throwaway-test-password' -alias 'throwaway-test-key' >/dev/null
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "R8_JAR=$RUNNER_TEMP/android-build/r8.jar" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-build/signing.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=throwaway-test-password" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=throwaway-test-key" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=throwaway-test-password" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: WebView ownership anti-regression gate (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/test-webview-ownership.ts 'https://appmintly.pages.dev/'

      - name: 'GUARD PASS: production-default build (no test options)'
        shell: bash
        run: |
          set -euo pipefail
          set -x
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          export APP_NAME='AppMintly Test' VERSION_NAME='1.0.5'
          export PACKAGE_ID='com.appmintly.appmintly' SOURCE_URL='https://appmintly.pages.dev/'
          export ICON_URL='https://appmintly.pages.dev/icon-512.png'
          export THEME_COLOR='#17191C' BACKGROUND_COLOR='#F8F2E7'
          # Throwaway-signing allowance only (validation pin bypass). NOTE:
          # no APK_ALARM_INTERVAL_MS, no APK_TEST_FIXTURE_SEED, no VERSION_CODE.
          export APK_ALLOW_TEST_SIGNING='1' APK_KEEP_SOURCE='1'
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/build-android-apk.ts
          ls -la evidence 2>&1 || echo 'EVIDENCE DIR MISSING'
          ls -la dist/apk 2>&1 || true
          APP_FILE="AppMintlyTest-1.0.5.apk"
          test -s "dist/apk/$APP_FILE"
          cp "dist/apk/$APP_FILE" "$RUNNER_TEMP/guard-default.apk"
          rm -f "dist/apk/$APP_FILE" dist/apk/validation.json
          for f in MainActivity UpdateEngine AlarmReceiver BootReceiver; do
            test -s "evidence/generated-$f.java"
            cp "evidence/generated-$f.java" "$RUNNER_TEMP/guard-default-$f.java"
          done
          # Production defaults MUST be intact on this branch.
          grep -q 'CHECK_INTERVAL_MS = 6L \* 60L \* 60L \* 1000L' "$RUNNER_TEMP/guard-default-UpdateEngine.java"
          ! grep -q 'seedTestFixture' "$RUNNER_TEMP/guard-default-UpdateEngine.java"
          BADGING="$(aapt dump badging "$RUNNER_TEMP/guard-default.apk")"
          echo "$BADGING" | grep -E "^package: name='com.appmintly.appmintly' versionCode='10005'"
          echo 'GUARD PASS: production-default config is byte-identical on this branch (6h interval, no fixture).'

      - name: 'TEST PASS: 2-minute interval + seeded fixture'
        shell: bash
        run: |
          set -euo pipefail
          set -x
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          export APP_NAME='AppMintly Test' VERSION_NAME='1.0.5' VERSION_CODE='90099'
          export PACKAGE_ID='com.appmintly.appmintly' SOURCE_URL='https://appmintly.pages.dev/'
          export ICON_URL='https://appmintly.pages.dev/icon-512.png'
          export THEME_COLOR='#17191C' BACKGROUND_COLOR='#F8F2E7'
          export APK_ALARM_INTERVAL_MS='120000' APK_ALARM_WAKEUP='1' APK_TEST_FIXTURE_SEED='1' APK_ALLOW_TEST_SIGNING='1' APK_KEEP_SOURCE='1'
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/build-android-apk.ts
          APP_FILE="AppMintlyTest-1.0.5.apk"
          test -s "dist/apk/$APP_FILE"
          for f in MainActivity UpdateEngine AlarmReceiver BootReceiver; do
            test -s "evidence/generated-$f.java"
            cp "evidence/generated-$f.java" "$RUNNER_TEMP/test-build-$f.java"
          done
          grep -q 'CHECK_INTERVAL_MS = 120000L' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          grep -q 'seedTestFixture' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          grep -q 'test_fixture_seeded' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          # Phase 12.16: self-healing seed - fixture re-asserted every fire,
          # delivered dedup map preserved after the first seed.
          grep -q 'Phase 12.16' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          grep -q 'if (first) e.putString("delivered", "{}");' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          grep -q 'boolean first = !p.getBoolean("test_fixture_seeded", false);' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          # Phase 12.15: the seed call moved from doCheck into AlarmReceiver.
          grep -q 'ELAPSED_REALTIME_WAKEUP' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          ! grep -q 'seedTestFixture(ctx);' "$RUNNER_TEMP/test-build-UpdateEngine.java"
          awk '/seedTestFixture\(context\);/{found=1} /isEnabled/{gate=1} END{exit !(found && gate)}' "$RUNNER_TEMP/test-build-AlarmReceiver.java"
          grep -A1 'seedTestFixture(context);' "$RUNNER_TEMP/test-build-AlarmReceiver.java" | grep -q 'isEnabled'
          ! grep -q 'seedTestFixture' "$RUNNER_TEMP/guard-default-AlarmReceiver.java"
          echo "APP_FILE=$APP_FILE" >> "$GITHUB_ENV"

      - name: 'ISOLATION PROOF: test build differs from production default ONLY in interval + seed'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY'
          import re, sys, os
          rt = sys.argv[1]
          g = open(os.path.join(rt, 'guard-default-UpdateEngine.java')).read()
          t = open(os.path.join(rt, 'test-build-UpdateEngine.java')).read()
          # Remove the seed helper method block.
          t2 = re.sub(r'    /\* TEMPORARY TEST BUILD ONLY[\s\S]*?\n    \}\n\n', '', t, count=1)
          assert t2 != t, 'seed helper block not found in test build UpdateEngine.java'
          # Remove the seed call inside doCheck.
          t2 = t2.replace('        seedTestFixture(ctx);\n', '', 1)
          # Normalize the interval constant back to the production expression.
          t2 = t2.replace('CHECK_INTERVAL_MS = 120000L;', 'CHECK_INTERVAL_MS = 6L * 60L * 60L * 1000L;', 1)
          t2 = t2.replace('AlarmManager.ELAPSED_REALTIME_WAKEUP,', 'AlarmManager.ELAPSED_REALTIME,', 1)
          assert t2 == g, 'UNEXPECTED DIFFERENCE beyond interval + wakeup alarm + fixture seed!'
          print('ISOLATION PASS: after removing the seed + restoring the interval,')
          print('the generated UpdateEngine.java is byte-identical to the production default.')
          PY
          cmp "$RUNNER_TEMP/guard-default-MainActivity.java" "$RUNNER_TEMP/test-build-MainActivity.java"
          cmp "$RUNNER_TEMP/guard-default-BootReceiver.java" "$RUNNER_TEMP/test-build-BootReceiver.java"
          python3 - "$RUNNER_TEMP" <<'PY2'
          import sys, os, re
          rt = sys.argv[1]
          g = open(os.path.join(rt, 'guard-default-AlarmReceiver.java')).read()
          t = open(os.path.join(rt, 'test-build-AlarmReceiver.java')).read()
          # Phase 12.16: the ONLY test-build delta is the seed block before
          # the master gate. Strip it with a regex and require byte-equality.
          pat = r' +// TEMPORARY TEST BUILD ONLY \(Phase 12\.16\)[\s\S]*?UpdateEngine\.seedTestFixture\(context\);\n'
          t2 = re.sub(pat, '', t, count=1)
          assert t2 != t, 'seed call block not found in test-build AlarmReceiver.java'
          assert t2 == g, 'UNEXPECTED DIFFERENCE in AlarmReceiver beyond the seed block!'
          assert len(t) - len(t2) < 400, 'stripped block suspiciously large'
          print('ALARM-RECEIVER ISOLATION PASS: after removing the seed block, byte-identical.')
          PY2
          echo 'ISOLATION PASS: MainActivity/BootReceiver are byte-identical across both passes.'

      - name: Validate the test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/apk/$APP_FILE"
          test -s "$APK"
          file "$APK" | grep -Ei 'zip archive|android'
          unzip -t "$APK" >/dev/null
          zipalign -c -v 4 "$APK" >/dev/null
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep -E "^package: name='com.appmintly.appmintly' versionCode='90099'"
          BADGE_TARGET_SDK="$(echo "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")"
          test "$BADGE_TARGET_SDK" -ge 36
          apksigner verify "$APK"
          CERT="$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer .* certificate SHA-256 digest: //p' | head -n1)"
          test -n "$CERT"
          # Fail closed if this somehow carries the production signing identity.
          case "$CERT" in dbafc6d3*) echo 'FATAL: production signing identity on test build!' >&2; exit 1;; esac
          echo "THROWAWAY signing cert SHA-256: $CERT"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "TEST APK SHA-256: $SHA256"
          {
            echo '# TEMPORARY TEST BUILD - NOT FOR PRODUCTION'
            echo ''
            echo '- APK: '"$APP_FILE"''
            echo '- SHA-256: '"$SHA256"''
            echo '- Package: com.appmintly.appmintly (production package required for the real engine)'
            echo '- versionCode: 90099 / versionName: 1.0.5 (test labeling)'
            echo '- Alarm interval: 120000 ms (test only; production default stays 6h - proven by the guard pass)'
            echo '- Fixture seed: self-healing - master on + tracked appmintly@1.0.3 + studyria@2.0.1 re-asserted every fire; delivered dedup map emptied once then preserved'
            echo '- Signing: THROWAWAY key generated in this runner: SHA-256 digest '"$CERT"''
            echo '- This build was never a release and must never be installed by anyone but the owner.'
          } > dist/apk/README-test-build.md
          cp "$RUNNER_TEMP"/guard-default-*.java dist/apk/
          cp "$RUNNER_TEMP"/test-build-*.java dist/apk/
          for f in "$RUNNER_TEMP"/guard-default-*.java; do
            mv "dist/apk/$(basename "$f")" "dist/apk/evidence-$(basename "$f")"
          done
          for f in "$RUNNER_TEMP"/test-build-*.java; do
            mv "dist/apk/$(basename "$f")" "dist/apk/evidence-$(basename "$f")"
          done
          echo "TEST_APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          {
            echo '### TEMPORARY TEST BUILD - NOT FOR PRODUCTION'
            echo ''
            echo '| Property | Value |'
            echo '|---|---|'
            echo '| APK | '"$APP_FILE"' |'
            echo '| SHA-256 | '"$SHA256"' |'
            echo '| Package | com.appmintly.appmintly (required for the real engine) |'
            echo '| versionCode / versionName | 90099 / 1.0.5 |'
            echo '| Alarm interval | 2 minutes (test only; production default 6h verified intact) |'
            echo '| Fixture | self-healing seed; delivered dedup map preserved after first fire |'
            echo '| Signing | THROWAWAY runner-generated key |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload short-lived test artifact
        uses: actions/upload-artifact@v4
        with:
          name: appmintly-native-checker-12-16-apk
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/apk/AppMintlyTest-1.0.5.apk
            dist/apk/validation.json
            dist/apk/README-test-build.md
            dist/apk/evidence-guard-default-*.java
            dist/apk/evidence-test-build-*.java

      - name: Cleanup guard build outputs
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/guard-default.apk"
          echo 'Guard APK deleted (never uploaded). Test APK remains ONLY in the artifact.'
