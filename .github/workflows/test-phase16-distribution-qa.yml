name: Phase 16 distribution QA (temporary)

# Temporary AppMintly Phase 16 test workflow. Verifies a test APK's real
# install / launch / update / reinstall behavior on an Android emulator,
# downloading the APK from the REAL public distribution URL (GitHub
# release asset), never from a local build artifact.
# NOTE: adb installs do not exercise Google Play Protect's device-side UI
# (ADB is a trusted install source and the emulator has no Play Store) —
# the real-device Play Protect observation is a separate manual test.
# This file is removed as part of Phase 16 cleanup.

on:
  workflow_dispatch:
    inputs:
      app_label:
        description: Expected app label in the UI
        required: true
        type: string
      package_id:
        description: Android package id
        required: true
        type: string
      apk_url_v1:
        description: Public release URL of v1
        required: true
        type: string
      sha256_v1:
        description: Expected SHA-256 of v1
        required: true
        type: string
      version_v1:
        description: Expected version string shown by v1
        required: true
        type: string
      apk_url_v2:
        description: Public release URL of v2 (update test; empty to skip)
        required: false
        type: string
        default: ''
      sha256_v2:
        description: Expected SHA-256 of v2
        required: false
        type: string
        default: ''
      version_v2:
        description: Expected version string shown by v2
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Download v1 from the real public distribution path
        run: |
          set -euo pipefail
          curl -sL --fail --retry 3 -o v1.apk "$APK_URL_V1"
          echo "$SHA256_V1  v1.apk" | sha256sum -c -
          stat -c 'v1 size: %s bytes' v1.apk
          [ "$(head -c 2 v1.apk | od -An -tx1 | tr -d ' \n')" = '504b' ] || { echo 'v1 is not a ZIP/APK'; exit 1; }
        env:
          APK_URL_V1: ${{ inputs.apk_url_v1 }}
          SHA256_V1: ${{ inputs.sha256_v1 }}

      - name: Download v2 from the real public distribution path
        if: ${{ inputs.apk_url_v2 != '' }}
        run: |
          set -euo pipefail
          curl -sL --fail --retry 3 -o v2.apk "$APK_URL_V2"
          echo "$SHA256_V2  v2.apk" | sha256sum -c -
          stat -c 'v2 size: %s bytes' v2.apk
          [ "$(head -c 2 v2.apk | od -An -tx1 | tr -d ' \n')" = '504b' ] || { echo 'v2 is not a ZIP/APK'; exit 1; }
        env:
          APK_URL_V2: ${{ inputs.apk_url_v2 }}
          SHA256_V2: ${{ inputs.sha256_v2 }}

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, update and reinstall on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p diag
            adb shell getprop ro.build.version.release | tee diag/android-version.txt
            adb shell getprop ro.product.model | tee diag/model.txt
            adb install v1.apk > diag/install-v1.txt 2>&1; grep -q Success diag/install-v1.txt || { echo 'FAIL: v1 install'; cat diag/install-v1.txt; exit 1; }
            adb shell am start -W -n ${{ inputs.package_id }}/.MainActivity > diag/launch-v1.txt 2>&1; sleep 25
            adb exec-out screencap -p > diag/screen-v1.png || true
            adb shell input keyevent 82; for n in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/d.xml > diag/dump-v1.txt 2>&1; adb pull /sdcard/d.xml diag/ui-v1.xml > /dev/null 2>&1; grep -q AppMintly diag/ui-v1.xml && break; sleep 8; done
            grep -q "${{ inputs.app_label }}" diag/ui-v1.xml || { echo 'FAIL: app label not visible in v1 UI'; exit 1; }
            adb shell dumpsys package ${{ inputs.package_id }} | grep versionName | head -n1 > diag/pkg-v1.txt; grep -q "versionName=${{ inputs.version_v1 }}" diag/pkg-v1.txt || { echo 'FAIL: installed package versionName is not ${{ inputs.version_v1 }}'; cat diag/pkg-v1.txt; exit 1; }
            grep -oE 'DISTTEST-[A-Z0-9]+' diag/ui-v1.xml | head -n1 > diag/data-v1.txt; test -s diag/data-v1.txt || { echo 'FAIL: no device data token in v1 UI'; exit 1; }
            adb install -r v2.apk > diag/install-v2.txt 2>&1; grep -q Success diag/install-v2.txt || { echo 'FAIL: v2 update install'; cat diag/install-v2.txt; exit 1; }
            adb shell am force-stop ${{ inputs.package_id }}; adb shell am start -W -n ${{ inputs.package_id }}/.MainActivity > diag/launch-v2.txt 2>&1; sleep 25
            adb exec-out screencap -p > diag/screen-v2.png || true
            adb shell input keyevent 82; for n in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/d.xml > diag/dump-v2.txt 2>&1; adb pull /sdcard/d.xml diag/ui-v2.xml > /dev/null 2>&1; grep -q AppMintly diag/ui-v2.xml && break; sleep 8; done
            adb shell dumpsys package ${{ inputs.package_id }} | grep versionName | head -n1 > diag/pkg-v2.txt; grep -q "versionName=${{ inputs.version_v2 }}" diag/pkg-v2.txt || { echo 'FAIL: package versionName did not update to ${{ inputs.version_v2 }}'; cat diag/pkg-v2.txt; exit 1; }
            grep -oE 'DISTTEST-[A-Z0-9]+' diag/ui-v2.xml | head -n1 > diag/data-v2.txt; test -s diag/data-v2.txt || { echo 'FAIL: no device data token after update'; exit 1; }
            test "$(cat diag/data-v2.txt)" = "$(cat diag/data-v1.txt)" || { echo 'FAIL: device data did NOT persist across update'; exit 1; }
            adb uninstall ${{ inputs.package_id }} > diag/uninstall.txt 2>&1
            adb install v2.apk > diag/install-fresh.txt 2>&1; grep -q Success diag/install-fresh.txt || { echo 'FAIL: fresh reinstall of v2'; cat diag/install-fresh.txt; exit 1; }
            adb shell am start -W -n ${{ inputs.package_id }}/.MainActivity > diag/launch-fresh.txt 2>&1; sleep 25
            adb exec-out screencap -p > diag/screen-fresh.png || true
            adb shell input keyevent 82; for n in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/d.xml > diag/dump-fresh.txt 2>&1; adb pull /sdcard/d.xml diag/ui-fresh.xml > /dev/null 2>&1; grep -q AppMintly diag/ui-fresh.xml && break; sleep 8; done
            adb shell dumpsys package ${{ inputs.package_id }} | grep versionName | head -n1 > diag/pkg-fresh.txt; grep -q "versionName=${{ inputs.version_v2 }}" diag/pkg-fresh.txt || { echo 'FAIL: reinstalled package versionName is not ${{ inputs.version_v2 }}'; cat diag/pkg-fresh.txt; exit 1; }
            grep -oE 'DISTTEST-[A-Z0-9]+' diag/ui-fresh.xml | head -n1 > diag/data-fresh.txt; test -s diag/data-fresh.txt || { echo 'FAIL: no device data token after fresh install'; exit 1; }
            test "$(cat diag/data-fresh.txt)" != "$(cat diag/data-v1.txt)" || { echo 'FAIL: fresh install did NOT reset device data'; exit 1; }
            adb shell am force-stop ${{ inputs.package_id }}; adb shell am start -W -n ${{ inputs.package_id }}/.MainActivity > diag/launch-reopen.txt 2>&1; sleep 25
            adb shell input keyevent 82; for n in 1 2 3 4 5; do adb shell uiautomator dump /sdcard/d.xml > diag/dump-reopen.txt 2>&1; adb pull /sdcard/d.xml diag/ui-reopen.xml > /dev/null 2>&1; grep -q AppMintly diag/ui-reopen.xml && break; sleep 8; done
            grep -q "${{ inputs.app_label }}" diag/ui-reopen.xml || { echo 'FAIL: app did not reopen'; exit 1; }
            echo '=== ALL PHASE 16 QA CHECKS PASSED ==='
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-qa-diagnostics
          path: diag
