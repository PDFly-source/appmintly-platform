name: Deploy AppMintly to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify apps.json Format
        run: node -e "const catalog = require('./data/apps.json'); if (!Array.isArray(catalog)) throw new Error('apps.json must be an array'); console.log('Validated ' + catalog.length + ' apps in catalog.');"

      - name: Build Next.js Application
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
