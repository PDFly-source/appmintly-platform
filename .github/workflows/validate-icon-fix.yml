name: Icon fix candidate validation (Phase 12.17)

# Phase 12.17: validates the AppMintly launcher icon fix BEFORE release.
# candidate mode: builds a THROWAWAY-signed candidate with the exact
# production inputs + official icon, proves the native engine Java is
# byte-identical to the pre-fix tree, verifies the icon resources inside
# the built APK (not just source), and installs it on a disposable
# Android 16 emulator to capture the real launcher drawer icon.
# released mode (validation-mode.txt = released): downloads the PUBLISHED
# 1.0.5 + 1.0.6 release assets, installs 1.0.6 as an in-place upgrade over
# 1.0.5 (no uninstall), verifies package/version/signing-cert continuity
# and captures the launcher drawer icon of the upgraded app.
# Never publishes, never touches the catalog, main, secrets or releases.
on:
  push:
    branches:
      - test/icon-fix-validation-12.17

permissions:
  contents: read

concurrency:
  group: icon-fix-validation
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  SIGNING_MODE: release
  APK_ARTIFACT_ONLY: '1'

jobs:
  candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # control build checks out the pre-fix commit b8dcc8f
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick zip unzip python3-pil
          mkdir -p "$RUNNER_TEMP/android-build"
          curl --fail --location --silent --show-error 'https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar' -o "$RUNNER_TEMP/android-build/r8.jar"
          keytool -genkeypair -keystore "$RUNNER_TEMP/android-build/signing.keystore" \
            -storepass 'throwaway-test-password' -keypass 'throwaway-test-password' \
            -alias 'throwaway-test-key' -keyalg RSA -keysize 2048 -validity 30 \
            -dname 'CN=AppMintly Temporary Test Build, OU=Test, O=Test, C=IN'
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "R8_JAR=$RUNNER_TEMP/android-build/r8.jar" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-build/signing.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=throwaway-test-password" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=throwaway-test-key" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=throwaway-test-password" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: 'CONTROL - generate the pre-fix tree Java (b8dcc8f, expected cert-pin failure tolerated, only the generated Java is compared)'
        shell: bash
        run: |
          set -euo pipefail
          git checkout b8dcc8f -- lib scripts
          export APP_NAME='AppMintly' VERSION_NAME='1.0.6'
          export PACKAGE_ID='com.appmintly.appmintly' SOURCE_URL='https://appmintly.pages.dev/'
          export ICON_URL='https://appmintly.pages.dev/icon-512.png'
          # The pre-fix tree has no test-signing allowance, so its APK
          # validation fails closed at the cert pin. That is expected here:
          # this build only supplies the PRE-FIX generated Java for the
          # engine byte-identity proof. The generated sources persist in the
          # build dir (/tmp/appforge-builds/<buildId>) after the failure.
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/build-android-apk.ts > control-build.log 2>&1 || true
          grep -q "Signing certificate mismatch" control-build.log && echo 'CONTROL build reached its expected pre-fix fail-closed cert gate (Java already generated)'
          mkdir -p "$RUNNER_TEMP/control"
          SRC="$(dirname "$(find /tmp/appforge-builds -name UpdateEngine.java | head -n 1)")"
          test -n "$SRC" && test -d "$SRC"
          for f in MainActivity UpdateEngine AlarmReceiver BootReceiver; do cp "$SRC/$f.java" "$RUNNER_TEMP/control/"; done
          ls "$RUNNER_TEMP/control"
          git checkout HEAD -- lib scripts
          echo 'CONTROL done (pre-fix generated Java collected).'
      - name: CANDIDATE build from the fixed tree
        shell: bash
        run: |
          set -euo pipefail
          export APP_NAME='AppMintly' VERSION_NAME='1.0.6'
          export PACKAGE_ID='com.appmintly.appmintly' SOURCE_URL='https://appmintly.pages.dev/'
          export ICON_URL='https://appmintly.pages.dev/icon-512.png'
          export APK_ALLOW_TEST_SIGNING='1' APK_KEEP_SOURCE='1'
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/build-android-apk.ts
          test -s "dist/apk/AppMintly-1.0.6.apk"
          mkdir -p "$RUNNER_TEMP/candidate" && cp evidence/generated-*.java "$RUNNER_TEMP/candidate/"
          cp dist/apk/AppMintly-1.0.6.apk "$RUNNER_TEMP/candidate.apk"
      - name: 'ENGINE UNCHANGED PROOF: generated Java byte-identical control vs candidate'
        shell: bash
        run: |
          set -euo pipefail
          for f in MainActivity UpdateEngine AlarmReceiver BootReceiver; do
            cmp "$RUNNER_TEMP/control/$f.java" "$RUNNER_TEMP/candidate/generated-$f.java"
            echo "IDENTICAL: $f.java (six-hour checker code untouched by the icon fix)"
          done
      - name: Verify icon resources inside the built APK (badging + pixel checks)
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/candidate.apk"
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING" | grep -E "^package: name='com.appmintly.appmintly' versionCode='10006' versionName='1.0.6'"
          echo "$BADGING" | grep -q "application-icon-640" && echo 'badging: application-icon entries present'
          echo "$BADGING" | grep -E "launchable-activity" | head -1
          mkdir -p "$RUNNER_TEMP/apkx" && unzip -o -q "$APK" -d "$RUNNER_TEMP/apkx"
          python3 - << 'PY'
          import os
          from PIL import Image
          rt = os.environ['RUNNER_TEMP']
          legacy = Image.open(f'{rt}/apkx/res/mipmap-xxxhdpi-v4/ic_launcher.png').convert('RGB')
          px = list(legacy.getdata()); n = len(px)
          dark = sum(1 for p in px if abs(p[0]-23)+abs(p[1]-25)+abs(p[2]-28) < 30)
          cream = sum(1 for p in px if abs(p[0]-252)+abs(p[1]-243)+abs(p[2]-229) < 45)
          assert dark/n < 0.05, f'letter-tile signature detected: {dark/n:.1%} dark pixels'
          assert cream/n > 0.15, f'official cream artwork not found: {cream/n:.1%}'
          print(f'LEGACY ICON: PASS (dark {dark/n:.1%}, cream {cream/n:.1%})')
          fg = Image.open(f'{rt}/apkx/res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png').convert('RGBA')
          w, h = fg.size
          pts = [(x, y) for y in range(0, h, 2) for x in range(0, w, 2) if fg.getpixel((x, y))[3] > 8]
          xs = [p[0] for p in pts]; ys = [p[1] for p in pts]
          bw = (max(xs)-min(xs))/w; bh = (max(ys)-min(ys))/h
          cx = (min(xs)+max(xs))/2/w; cy = (min(ys)+max(ys))/2/h
          assert bw <= 0.62 and bh <= 0.62, f'content not fitted: {bw:.1%} x {bh:.1%} of canvas'
          assert abs(cx-0.5) < 0.03 and abs(cy-0.5) < 0.03, f'content off-center: {cx:.3f},{cy:.3f}'
          print(f'ADAPTIVE FOREGROUND: PASS (content {bw:.1%} x {bh:.1%} of canvas, centered {cx:.3f},{cy:.3f})')
          PY
      - name: Compose before/after evidence and upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon-evidence
          curl -fsSL -o icon-evidence/old-shipped-1.0.5.apk "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.5/AppMintly-1.0.5.apk"
          unzip -p icon-evidence/old-shipped-1.0.5.apk res/mipmap-xxxhdpi-v4/ic_launcher.png > icon-evidence/before-1.0.5-letter-tile.png
          unzip -p icon-evidence/old-shipped-1.0.5.apk res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png > icon-evidence/before-1.0.5-adaptive-foreground.png
          cp "$RUNNER_TEMP/apkx/res/mipmap-xxxhdpi-v4/ic_launcher.png" icon-evidence/after-1.0.6-launcher.png
          cp "$RUNNER_TEMP/apkx/res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png" icon-evidence/after-1.0.6-adaptive-foreground.png
          cp "$RUNNER_TEMP/apkx/res/mipmap-xxxhdpi-v4/ic_launcher_round.png" icon-evidence/after-1.0.6-round.png
          cp "$RUNNER_TEMP/candidate.apk" icon-evidence/AppMintly-1.0.6-candidate.apk
          cp "$RUNNER_TEMP"/candidate/generated-*.java icon-evidence/
          ls -la icon-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: icon-fix-candidate
          retention-days: 7
          if-no-files-found: error
          path: icon-evidence/

  emulator-device-check:
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: icon-fix-candidate
          path: candidate/
      - name: Select APK by mode
        shell: bash
        run: |
          set -euo pipefail
          MODE=$(tr -d '[:space:]' < validation-mode.txt)
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          if [ "$MODE" = "released" ]; then
            mkdir -p released
            curl -fsSL -o released/AppMintly-1.0.5.apk "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.5/AppMintly-1.0.5.apk"
            curl -fsSL -o released/AppMintly-1.0.6.apk "https://github.com/PDFly-source/appmintly-releases/releases/download/appmintly-v1.0.6/AppMintly-1.0.6.apk"
            pip install --quiet androguard
            python3 - << 'PY'
            import hashlib, logging
            logging.disable(logging.CRITICAL)
            try:
                from loguru import logger as _l; _l.remove()
            except Exception:
                pass
            from androguard.core.apk import APK
            EXPECTED = "dbafc6d389516069518826d1e1320cebcf7970eec9249d749de699b730f61368"
            for f in ("released/AppMintly-1.0.5.apk", "released/AppMintly-1.0.6.apk"):
                a = APK(f)
                cert = hashlib.sha256((a.get_certificates_der_v2() or a.get_certificates_der())[0]).hexdigest()
                assert cert == EXPECTED, f"{f}: signer cert mismatch {cert}"
                assert a.get_package() == "com.appmintly.appmintly"
                print(f"RELEASED {f}: package OK, signerCert sha256={cert}")
            a6 = APK("released/AppMintly-1.0.6.apk")
            assert a6.get_androidversion_code() == "10006", a6.get_androidversion_code()
            assert a6.get_androidversion_name() == "1.0.6", a6.get_androidversion_name()
            print("CERT CONTINUITY: PASS (1.0.5 and 1.0.6 signed by the same production identity)")
            print("sha256(1.0.6) =", hashlib.sha256(open("released/AppMintly-1.0.6.apk","rb").read()).hexdigest())
            PY
          fi
      - name: Device validation (Android 16 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            mkdir -p diag
            adb root || true
            timeout 300 adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done' || true
            adb shell settings put global window_animation_scale 0.0 || true
            adb shell settings put global transition_animation_scale 0.0 || true
            adb shell settings put global animator_duration_scale 0.0 || true
            if [ "$MODE" = "released" ]; then
              adb install released/AppMintly-1.0.5.apk | tee diag/install-1.0.5.txt
              grep -q Success diag/install-1.0.5.txt
              adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode=|versionName=" | head -2 > diag/pkg-before-upgrade.txt || true
              adb install -r released/AppMintly-1.0.6.apk | tee diag/install-1.0.6.txt
              grep -q Success diag/install-1.0.6.txt && echo "UPGRADE-OVER-INSTALL: PASS (1.0.6 installed over 1.0.5, NO uninstall)"
              adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode=|versionName=" | head -2 | tee diag/pkg-after-upgrade.txt
              grep -q "versionCode=10006" diag/pkg-after-upgrade.txt && echo "ON-DEVICE VERSION: PASS (versionCode=10006, versionName=1.0.6)"
            else
              adb install candidate/AppMintly-1.0.6-candidate.apk | tee diag/install-candidate.txt
              grep -q Success diag/install-candidate.txt && echo "CANDIDATE INSTALL: PASS"
              adb shell dumpsys package com.appmintly.appmintly | grep -E "versionCode=|versionName=" | head -2 | tee diag/pkg-candidate.txt
              grep -q "versionCode=10006" diag/pkg-candidate.txt && echo "ON-DEVICE VERSION: PASS (versionCode=10006, versionName=1.0.6)"
            fi
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell am start -n com.appmintly.appmintly/.MainActivity | tee diag/launch.txt
            sleep 25
            adb exec-out screencap -p > diag/app-launched.png
            adb shell uiautomator dump /sdcard/appdump.xml >/dev/null 2>&1 || true
            adb pull /sdcard/appdump.xml diag/appdump.xml >/dev/null 2>&1 || true
            grep -q "AppMintly" diag/appdump.xml && echo "APP LAUNCH: PASS (marketplace content rendered)" || echo "APP LAUNCH: content check inconclusive (screencap saved as evidence)"
            adb shell input keyevent KEYCODE_HOME || true
            sleep 2
            adb shell input swipe 540 2200 540 400 250 || true
            sleep 3
            adb shell uiautomator dump /sdcard/drawerdump.xml >/dev/null 2>&1 || true
            adb pull /sdcard/drawerdump.xml diag/drawerdump.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > diag/drawer.png
            python3 - << 'PY'
            import re
            from PIL import Image
            xml = open('diag/drawerdump.xml', encoding='utf-8', errors='replace').read()
            m = None
            for match in re.finditer(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml):
                x1, y1, x2, y2 = map(int, match.groups())
                node = xml[max(0, match.start()-1200):match.start()]
                if ('text="AppMintly"' in node or 'content-desc="AppMintly"' in node) and y2 < 800:
                    m = (x1, y1, x2, y2)
                    break
            assert m, 'AppMintly icon node not found in the drawer dump - see diag/drawer.png'
            x1, y1, x2, y2 = m
            side = max(1, x2 - x1)
            im = Image.open('diag/drawer.png').convert('RGB')
            ix1, iy1 = x1, max(0, y1 - int(side * 1.9))
            ix2, iy2 = x2, max(1, y1 - int(side * 0.15))
            crop = im.crop((ix1, iy1, ix2, iy2))
            crop.save('diag/launcher-icon-region.png')
            px = list(crop.getdata()); n = len(px)
            dark = sum(1 for p in px if p[0] < 60 and p[1] < 60 and p[2] < 60)
            cream = sum(1 for p in px if abs(p[0]-252)+abs(p[1]-243)+abs(p[2]-229) < 45)
            light = sum(1 for p in px if p[0] > 200 and p[1] > 200 and p[2] > 190)
            print(f'launcher icon region: dark {dark/n:.1%}, cream {cream/n:.1%}, light {light/n:.1%}')
            assert dark/n < 0.15, f'generic dark letter tile still rendered ({dark/n:.1%} dark)'
            assert (cream + light)/n > 0.35, 'official cream logo not visible in the launcher icon'
            print('LAUNCHER ICON ON DEVICE: PASS (cream official logo rendered, not the dark letter tile)')
            PY
            echo "DEVICE VALIDATION COMPLETE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-fix-device-evidence
          retention-days: 7
          path: diag/
