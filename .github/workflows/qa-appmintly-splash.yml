name: QA - AppMintly launch splash (temporary)

# Visual and behavioural proof for the AppMintly launch splash on a real Android
# image: the first frame is the owner-supplied light canvas (never the old dark
# gradient), the animation actually runs, the four dots and both rings are drawn,
# the splash retires into the live marketplace, and a rotation / relaunch /
# reduced-motion pass cannot leave a stuck or blank screen.
#
# Temporary: delete after the reported run.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Actions run id of the release-signed artifact build'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name that holds the APK'
        required: true
        type: string
      apk_name:
        description: 'APK file name inside the artifact'
        required: true
        type: string
      apk_sha:
        description: 'Expected SHA-256 of the APK'
        required: true
        type: string
      splash_design:
        description: 'Design profile the analyzer should expect (appmintly | pdfminifly | billcraft)'
        required: false
        type: string
        default: appmintly
      splash_desc:
        description: 'content-desc the native splash view exposes'
        required: false
        type: string
        default: AppMintly
      splash_pkg:
        description: 'Android package id to verify on the device'
        required: false
        type: string
        default: com.appmintly.appmintly
      splash_version:
        description: 'Expected versionName on the device'
        required: false
        type: string
        default: '1.0.12'
      apk_url:
        description: 'Optional public HTTPS URL of an already-published APK. When set, the exact published bytes are tested and the build-run inputs are ignored.'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  splash-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the QA tooling
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch the published APK from its public release URL
        if: ${{ inputs.apk_url != '' }}
        run: |
          set -euo pipefail
          mkdir -p apk
          curl -fsSL --retry 3 --retry-delay 5 \
            -o "apk/${{ inputs.apk_name }}" "${{ inputs.apk_url }}"
          ls -l "apk/${{ inputs.apk_name }}"

      - name: Fetch the production-signed APK from the build run
        if: ${{ inputs.apk_url == '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          name: ${{ inputs.artifact_name }}
          path: apk
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the downloaded APK before touching a device
        run: |
          set -euo pipefail
          FOUND=$(find apk -name '${{ inputs.apk_name }}' -print -quit)
          test -n "$FOUND"
          SHA=$(sha256sum "$FOUND" | cut -d' ' -f1)
          echo "source=${{ inputs.apk_url != '' && 'published-release-asset' || 'build-artifact' }}"
          echo "file=$FOUND sha256=$SHA size=$(stat -c%s "$FOUND")"
          test "$SHA" = "${{ inputs.apk_sha }}"

      - name: Install the emulator audio runtime
        run: |
          set -uo pipefail
          # Emulator 37.x links libpulse even when started with -no-audio. The
          # runner's package mirror is unreliable (DNS failures take minutes to
          # time out), so use the bundled runtime instead of apt.
          if ldconfig -p | grep -q 'libpulse\.so\.0'; then
            echo "libpulse.so.0 already on the image"
          else
            sudo mkdir -p /usr/local/lib/pulse
            sudo tar xzf ci/emulator-deps/libpulse-emulator-deps.tgz -C /usr/local/lib/pulse
            echo /usr/local/lib/pulse | sudo tee /etc/ld.so.conf.d/appmintly-emulator-pulse.conf >/dev/null
            sudo ldconfig
          fi
          PULSE="$(ldconfig -p | awk '/libpulse\.so\.0 /{print $NF; exit}')"
          if [ -z "$PULSE" ]; then echo "::error::libpulse.so.0 is not resolvable"; exit 1; fi
          echo "libpulse.so.0 -> $PULSE"
          if ldd "$PULSE" | grep -q 'not found'; then
            ldd "$PULSE" | grep 'not found'
            echo "::error::libpulse.so.0 has unresolved dependencies"
            exit 1
          fi

      - name: Boot an API 36 emulator with the APK installed
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader_indirect -no-metrics -camera-back none -camera-front none
          # The action runs this through /bin/sh, so it must stay POSIX:
          # `set -o pipefail` would abort with exit code 2 before anything runs.
          script: bash scripts/ci/splash-qa.sh
        env:
          SPLASH_DESIGN: ${{ inputs.splash_design }}
          SPLASH_DESC: ${{ inputs.splash_desc }}
          SPLASH_PKG: ${{ inputs.splash_pkg }}
          SPLASH_VERSION: ${{ inputs.splash_version }}

      - name: Upload splash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splash-qa-${{ github.run_id }}
          path: |
            splash-qa/
            splash-qa/report.txt
          if-no-files-found: warn
          retention-days: 14
