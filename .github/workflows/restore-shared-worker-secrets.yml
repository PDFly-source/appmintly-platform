name: Restore shared Worker secrets (one-time)

# Owner-authorized, single-purpose maintenance workflow.
#
# Copies ONE existing GitHub Actions secret into its Cloudflare Worker secret so
# the exact value is restored WITHOUT rotation and WITHOUT ever being displayed.
# Design and security review:
#   deliverables/AppMintly-shared-secret-restoration-workflow-review.md
#
# This workflow never deploys, publishes, emits events, or touches Pages, KV,
# Durable Objects or catalog data. It writes exactly one Worker secret per run.

run-name: Restore Worker secret - ${{ inputs.pair }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE-SHARED-SECRETS to authorize this single write'
        required: true
        type: string
      pair:
        description: 'Which Worker secret to restore'
        required: true
        type: choice
        options:
          - emission
          - export

permissions: {}

concurrency:
  group: restore-shared-worker-secrets
  cancel-in-progress: false

jobs:
  restore:
    name: Write one Worker secret from its Actions secret
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: worker-secret-restore
    steps:
      - name: Preflight (no credential or value printed)
        env:
          CF_API: https://api.cloudflare.com/client/v4
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_WORKER_SECRETS_TOKEN }}
          SCRIPT: appmintly-publisher-api
          CONFIRM: ${{ inputs.confirm }}
          PAIR: ${{ inputs.pair }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RESTORE-SHARED-SECRETS" || { echo "::error::Confirmation phrase mismatch; nothing written."; exit 1; }
          case "$PAIR" in emission|export) ;; *) echo "::error::Invalid pair input; nothing written."; exit 1 ;; esac
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo "::error::Refusing to run outside main; nothing written."; exit 1; }
          test -n "${CF_TOKEN:-}" || { echo "::error::CF_WORKER_SECRETS_TOKEN is not configured; nothing written."; exit 1; }
          test -n "${CF_ACCOUNT:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured; nothing written."; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --proto '=https' --tlsv1.2 --max-redirs 0 \
            --config <(printf 'header = "Authorization: Bearer %s"\n' "$CF_TOKEN") \
            "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$SCRIPT/settings")
          test "$code" = "200" || { echo "::error::Token cannot read target Worker (HTTP $code); nothing written."; exit 1; }
          echo "Preflight OK for pair=$PAIR"

      - name: Write APPMINTLY_EVENTS_EMISSION_SECRET
        if: ${{ inputs.pair == 'emission' }}
        env:
          CF_API: https://api.cloudflare.com/client/v4
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_WORKER_SECRETS_TOKEN }}
          SCRIPT: appmintly-publisher-api
          TARGET_NAME: APPMINTLY_EVENTS_EMISSION_SECRET
          VALUE: ${{ secrets.EVENT_EMISSION_SECRET }}
        run: |
          set -euo pipefail
          test -n "${VALUE:-}" || { echo "::error::EVENT_EMISSION_SECRET is empty; nothing written."; exit 1; }
          http=$(printf '%s' "$VALUE" \
            | jq -Rs --arg name "$TARGET_NAME" '{name:$name,type:"secret_text",text:.}' \
            | curl -sS -o /dev/null -w '%{http_code}' \
                --proto '=https' --tlsv1.2 --max-redirs 0 \
                --config <(printf 'header = "Authorization: Bearer %s"\n' "$CF_TOKEN") \
                -X PUT "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$SCRIPT/secrets" \
                -H 'Content-Type: application/json' \
                --data-binary @-)
          if [ "$http" = "200" ]; then
            printf '| `%s` | %s | written |\n' "$TARGET_NAME" "$http" >> "$GITHUB_STEP_SUMMARY"
            echo "Written: $TARGET_NAME (HTTP $http)"
          else
            printf '| `%s` | %s | FAILED |\n' "$TARGET_NAME" "$http" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Write failed for $TARGET_NAME (HTTP $http). Stopping; no further writes."
            exit 1
          fi

      - name: Write APPMINTLY_EXPORT_KEY
        if: ${{ inputs.pair == 'export' }}
        env:
          CF_API: https://api.cloudflare.com/client/v4
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CF_WORKER_SECRETS_TOKEN }}
          SCRIPT: appmintly-publisher-api
          TARGET_NAME: APPMINTLY_EXPORT_KEY
          VALUE: ${{ secrets.APPMINTLY_EXPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "${VALUE:-}" || { echo "::error::APPMINTLY_EXPORT_KEY is empty; nothing written."; exit 1; }
          http=$(printf '%s' "$VALUE" \
            | jq -Rs --arg name "$TARGET_NAME" '{name:$name,type:"secret_text",text:.}' \
            | curl -sS -o /dev/null -w '%{http_code}' \
                --proto '=https' --tlsv1.2 --max-redirs 0 \
                --config <(printf 'header = "Authorization: Bearer %s"\n' "$CF_TOKEN") \
                -X PUT "$CF_API/accounts/$CF_ACCOUNT/workers/scripts/$SCRIPT/secrets" \
                -H 'Content-Type: application/json' \
                --data-binary @-)
          if [ "$http" = "200" ]; then
            printf '| `%s` | %s | written |\n' "$TARGET_NAME" "$http" >> "$GITHUB_STEP_SUMMARY"
            echo "Written: $TARGET_NAME (HTTP $http)"
          else
            printf '| `%s` | %s | FAILED |\n' "$TARGET_NAME" "$http" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Write failed for $TARGET_NAME (HTTP $http). Stopping; no further writes."
            exit 1
          fi
