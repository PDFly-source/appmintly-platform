<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6eed8">
<title>Niramay splash</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f6eed8}
*{box-sizing:border-box}
:root{--k:1.5}
.sp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
.stage{position:relative;flex:none;width:228px;height:488px;zoom:var(--k)}
@supports not (zoom:1){.stage{transform:scale(var(--k))}}
.stage>*{position:absolute}
.fb{position:absolute}
.ctr{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:44px}
.ctr img{display:block;mix-blend-mode:multiply}
.cc{left:50%;top:190px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.72);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes ring{from{opacity:.9;transform:scale(.45)}to{opacity:0;transform:scale(1.6)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes fill{to{width:100%}}
@keyframes pulse{50%{opacity:1;transform:scale(1.35)}}
@keyframes glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.go .mk{animation:zoom 1s cubic-bezier(.2,.9,.3,1.1) .2s both}
.go .tx{animation:rise .8s ease .9s both}
.pb{left:60px;right:60px;bottom:54px;height:5px;border-radius:5px;background:rgba(0,0,0,.07);overflow:hidden}
.pb:after{content:"";display:block;height:100%;width:0;border-radius:5px;background:var(--pg)}
.go .pb:after{animation:fill 2.4s cubic-bezier(.4,0,.2,1) .6s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sp{background:radial-gradient(circle at 50% 38%,#fffef8,#f6eed8 85%)}
.gl{width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(212,170,70,.28),transparent 68%);opacity:0}
.go .gl{animation:glow 2s ease .1s both}
.gd{width:calc(4px*var(--k));height:calc(4px*var(--k));border-radius:50%;background:#c9a24a;opacity:0;animation:float 3.6s ease-in-out infinite}
@keyframes float{0%{opacity:0;transform:translateY(calc(24px*var(--k)))}40%{opacity:.9}100%{opacity:0;transform:translateY(calc(-56px*var(--k)))}}
@keyframes soft{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.go .mk{animation:soft 1.5s cubic-bezier(.2,.7,.2,1) .3s both}
.go .tx{animation:rise 1.1s ease 1.2s both}
.gl2{left:50%;bottom:58px;height:1px;width:0;margin-left:-60px;background:linear-gradient(90deg,transparent,#c9a24a,transparent)}
@keyframes lw{to{width:120px}}
.go .gl2{animation:lw 1.4s ease 1.6s both}
</style></head><body>
