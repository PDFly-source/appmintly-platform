<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0eeff">
<title>Cineflow splash</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f0eeff}
*{box-sizing:border-box}
:root{--k:1.5}
.sp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
.stage{position:relative;flex:none;width:228px;height:488px;zoom:var(--k)}
@supports not (zoom:1){.stage{transform:scale(var(--k))}}
.stage>*{position:absolute}
.fb{position:absolute}
.ctr{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:44px}
.ctr img{display:block;mix-blend-mode:multiply}
.cc{left:50%;top:190px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.72);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes ring{from{opacity:.9;transform:scale(.45)}to{opacity:0;transform:scale(1.6)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes fill{to{width:100%}}
@keyframes pulse{50%{opacity:1;transform:scale(1.35)}}
@keyframes glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.go .mk{animation:zoom 1s cubic-bezier(.2,.9,.3,1.1) .2s both}
.go .tx{animation:rise .8s ease .9s both}
.pb{left:60px;right:60px;bottom:54px;height:5px;border-radius:5px;background:rgba(0,0,0,.07);overflow:hidden}
.pb:after{content:"";display:block;height:100%;width:0;border-radius:5px;background:var(--pg)}
.go .pb:after{animation:fill 2.4s cubic-bezier(.4,0,.2,1) .6s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sp{background:linear-gradient(160deg,#f5f7ff,#ede8ff)}
.fs{left:0;right:0;height:calc(26px*var(--k));background:#141a4a}
.fs:before{content:"";position:absolute;left:0;right:0;top:calc(9px*var(--k));height:calc(8px*var(--k));background:repeating-linear-gradient(90deg,#eef0ff 0 calc(10px*var(--k)),transparent calc(10px*var(--k)) calc(20px*var(--k)));animation:scroll 1.2s linear infinite}
.f1{top:13.5%;transform-origin:left}.f2{bottom:13.5%;transform-origin:right}.f2:before{animation-direction:reverse}
@keyframes scroll{to{background-position-x:calc(20px*var(--k))}}
@keyframes sx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.go .fs{animation:sx 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateY(-80deg) scale(.8)}to{opacity:1;transform:perspective(700px)}}
.go .mk{animation:flip 1.1s cubic-bezier(.2,.8,.2,1) .35s both}
</style></head><body>
